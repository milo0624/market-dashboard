function ItemPanel({ type, items, categories, form, setForm, onAdd, onRemove, total, getEffectiveRate, knownItems, onImportFile, onEdit, latestItemDate, onCleanup, onRefreshHolding }) {
  const isAsset = type === 'asset';
  const listId = `known-${type}-list`;
  const fileInputRef = useRef(null);
  const [importMsg, setImportMsg] = useState('');
  const [cleanupMsg, setCleanupMsg] = useState('');
  const [formMsg, setFormMsg] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [refreshingIds, setRefreshingIds] = useState([]);

  const handleRefreshHolding = async (id) => {
    setRefreshingIds((prev) => [...prev, id]);
    try {
      await onRefreshHolding(id);
    } catch (e) {
      /* 更新失敗就保留原本的金額 */
    }
    setRefreshingIds((prev) => prev.filter((x) => x !== id));
  };
  const [editForm, setEditForm] = useState(null);

  const startEdit = (item) => {
    setEditingId(item.id);
    setEditForm({
      name: item.name,
      category: item.category,
      currency: item.currency || 'TWD',
      amount: String(item.amount),
      date: todayStr(),
    });
  };

  const cancelEdit = () => {
    setEditingId(null);
    setEditForm(null);
  };

  const saveEdit = () => {
    const amount = evaluateExpr(editForm.amount);
    if (!editForm.name.trim() || !amount || amount <= 0) return;
    onEdit(editingId, {
      name: editForm.name.trim(),
      category: editForm.category,
      currency: editForm.currency,
      amount,
      date: editForm.date || todayStr(),
    });
    setEditingId(null);
    setEditForm(null);
  };

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const result = await onImportFile(file);
    if (result.error) {
      setImportMsg(result.error);
    } else {
      const parts = [];
      if (result.assetAdded || result.assetUpdated) {
        parts.push(`資產：新增 ${result.assetAdded} 筆、更新 ${result.assetUpdated} 筆`);
      }
      if (result.liabilityAdded || result.liabilityUpdated) {
        parts.push(`負債：新增 ${result.liabilityAdded} 筆、更新 ${result.liabilityUpdated} 筆`);
      }
      setImportMsg(
        parts.length === 0
          ? '沒有讀到任何有效資料，請確認欄位名稱與內容'
          : `已匯入 — ${parts.join('；')}${result.skipped > 0 ? `，略過 ${result.skipped} 筆（缺名稱或金額）` : ''}`
      );
    }
    e.target.value = '';
  };

  return (
    <section className="panel">
      <div className="panel-head">
        <h3>{isAsset ? '資產清單' : '負債清單'}</h3>
        <span className="panel-total">{formatMoney(total)}</span>
      </div>

      <div className="import-row">
        <button type="button" className="ghost-btn small" onClick={() => fileInputRef.current.click()}>
          📥 匯入 Excel
        </button>
        <button
          type="button"
          className="ghost-btn small"
          onClick={() => {
            const { removed } = onCleanup();
            setCleanupMsg(removed > 0 ? `已清除 ${removed} 筆重複項目（同名項目僅保留日期最新的那筆）` : '沒有找到重複的項目名稱');
          }}
        >
          ✨ 清理重複項目
        </button>
        <span className="import-hint">欄位：名稱、分類、幣別、金額、日期（分類自動判斷資產／負債；同名項目會更新既有資料，不會重複新增）</span>
        <input
          ref={fileInputRef}
          type="file"
          accept=".xlsx,.xls,.csv"
          style={{ display: 'none' }}
          onChange={handleFile}
        />
      </div>
      {importMsg && <p className="import-msg">{importMsg}</p>}
      {cleanupMsg && <p className="import-msg">{cleanupMsg}</p>}

      <form className="add-form" onSubmit={(e) => {
        e.preventDefault();
        const result = onAdd();
        if (result && result.updated) {
          setFormMsg(`偵測到同名項目，已更新「${result.name}」的金額與日期，沒有新增重複項目`);
        } else {
          setFormMsg('');
        }
      }}>
        <div className="add-form-name-row">
          <input
            type="text"
            className="add-form-name"
            list={listId}
            placeholder={isAsset ? '例如：台幣活存（可從清單挑選）' : '例如：房屋貸款（可從清單挑選）'}
            value={form.name}
            onChange={(e) => {
              const val = e.target.value;
              const match = knownItems.find((k) => k.name === val);
              if (match) {
                setForm({ ...form, name: val, category: match.category, currency: match.currency });
              } else {
                setForm({ ...form, name: val });
              }
            }}
          />
          <input
            type="date"
            className="add-form-date"
            value={form.date || todayStr()}
            onChange={(e) => setForm({ ...form, date: e.target.value })}
          />
        </div>
        <datalist id={listId}>
          {knownItems.map((k) => <option key={k.name} value={k.name} />)}
        </datalist>
        <div className="add-form-row">
          <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
            {categories.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
          <select value={form.currency} onChange={(e) => setForm({ ...form, currency: e.target.value })}>
            {CURRENCIES.map((c) => <option key={c.code} value={c.code}>{c.symbol} {c.code}</option>)}
          </select>
          <div className="amount-field">
            <input
              type="text"
              inputMode="decimal"
              placeholder="金額或算式，例如 1000+250"
              value={form.amount}
              onChange={(e) => setForm({ ...form, amount: e.target.value })}
            />
            {/[+\-*/]/.test(form.amount) && !Number.isNaN(evaluateExpr(form.amount)) && (
              <span className="amount-preview">= {evaluateExpr(form.amount).toLocaleString(undefined, { maximumFractionDigits: 2 })}</span>
            )}
          </div>
          <button type="submit" className="add-btn">＋</button>
        </div>
      </form>
      {formMsg && <p className="import-msg">{formMsg}</p>}

      {items.length === 0 ? (
        <p className="empty-note">{isAsset ? '還沒有記錄任何資產。' : '還沒有記錄任何負債，太棒了！'}</p>
      ) : (
        <ul className="item-list">
          {items.map((item) => {
            if (editingId === item.id) {
              return (
                <li key={item.id} className="item-edit-row">
                  <input
                    type="text"
                    value={editForm.name}
                    onChange={(e) => setEditForm({ ...editForm, name: e.target.value })}
                  />
                  <div className="item-edit-fields">
                    <select value={editForm.category} onChange={(e) => setEditForm({ ...editForm, category: e.target.value })}>
                      {categories.map((c) => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <select value={editForm.currency} onChange={(e) => setEditForm({ ...editForm, currency: e.target.value })}>
                      {CURRENCIES.map((c) => <option key={c.code} value={c.code}>{c.symbol} {c.code}</option>)}
                    </select>
                    <input
                      type="text"
                      inputMode="decimal"
                      placeholder="金額或算式"
                      value={editForm.amount}
                      onChange={(e) => setEditForm({ ...editForm, amount: e.target.value })}
                    />
                    <input
                      type="date"
                      value={editForm.date}
                      onChange={(e) => setEditForm({ ...editForm, date: e.target.value })}
                    />
                  </div>
                  <div className="item-edit-actions">
                    <button className="add-btn" onClick={saveEdit} aria-label="儲存">✓</button>
                    <button className="del-btn" onClick={cancelEdit} aria-label="取消">✕</button>
                  </div>
                </li>
              );
            }
            const itemCurrency = item.currency || 'TWD';
            const twdValue = itemCurrency === 'TWD' ? item.amount : item.amount * getEffectiveRate(itemCurrency);
            return (
              <li key={item.id}>
                <div className="item-info">
                  <span className="item-name">{item.name}</span>
                  <span className="item-cat">{item.category}</span>
                  {item.ticker && (
                    <span className="item-date">
                      📈 {item.ticker} · {item.shares} 股
                      {item.priceUpdatedAt
                        ? ` · 股價更新於 ${new Date(item.priceUpdatedAt).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' })}`
                        : ''}
                    </span>
                  )}
                  {item.date && (
                    <span className="item-date">
                      📅 {item.date}
                      {getWeekKey(item.date) === getWeekKey(latestItemDate) && (
                        <span className="item-week-badge">本週已更新</span>
                      )}
                    </span>
                  )}
                </div>
                <div className="item-right">
                  <div className="item-amount-block">
                    <span className="item-amount">{formatMoney(item.amount, itemCurrency)}</span>
                    {itemCurrency !== 'TWD' && (
                      <span className="item-amount-sub">≈ {formatMoney(twdValue, 'TWD')}</span>
                    )}
                  </div>
                  {item.ticker && (
                    <button
                      className="edit-btn"
                      onClick={() => handleRefreshHolding(item.id)}
                      disabled={refreshingIds.includes(item.id)}
                      aria-label="更新股價"
                    >
                      <span className={refreshingIds.includes(item.id) ? 'spin' : ''}>🔄</span>
                    </button>
                  )}
                  <button className="edit-btn" onClick={() => startEdit(item)} aria-label="編輯">✏️</button>
                  <button className="del-btn" onClick={() => onRemove(item.id)} aria-label="刪除">🗑</button>
                </div>
              </li>
            );
          })}
        </ul>
      )}
    </section>
  );
}

function AllocationPanel({ allocation, totalAssets, trendData, hasCategoryHistory }) {
  const pieCanvasRef = useRef(null);
  const pieChartRef = useRef(null);
  const trendCanvasRef = useRef(null);
  const trendChartRef = useRef(null);

  useEffect(() => {
    if (!pieCanvasRef.current || allocation.length === 0) return;
    if (pieChartRef.current) pieChartRef.current.destroy();
    const ctx = pieCanvasRef.current.getContext('2d');
    pieChartRef.current = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: allocation.map((d) => d.name),
        datasets: [{
          data: allocation.map((d) => d.value),
          backgroundColor: allocation.map((d) => d.color),
          borderColor: '#10152a',
          borderWidth: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '60%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: { label: (c) => `${c.label}：${formatMoney(c.parsed)}` },
            backgroundColor: '#1a2140',
            borderColor: 'rgba(255,255,255,0.1)',
            borderWidth: 1,
            titleColor: '#9aa3c7',
            bodyColor: '#f1ede2',
          },
        },
      },
    });
    return () => { if (pieChartRef.current) pieChartRef.current.destroy(); };
  }, [allocation]);

  useEffect(() => {
    if (!trendCanvasRef.current || !hasCategoryHistory || trendData.length < 2) return;
    if (trendChartRef.current) trendChartRef.current.destroy();
    const ctx = trendCanvasRef.current.getContext('2d');
    trendChartRef.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: trendData.map((d) => d.label),
        datasets: ASSET_CATEGORIES.map((c) => ({
          label: c,
          data: trendData.map((d) => d.values[c]),
          borderColor: ASSET_CATEGORY_COLORS[c],
          backgroundColor: ASSET_CATEGORY_COLORS[c],
          tension: 0.3,
          pointRadius: 2.5,
          spanGaps: true,
        })),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { color: '#9aa3c7', font: { size: 11 }, boxWidth: 10 } },
          tooltip: {
            callbacks: { label: (c) => `${c.dataset.label}：${formatMoney(c.parsed.y)}` },
            backgroundColor: '#1a2140',
            borderColor: 'rgba(255,255,255,0.1)',
            borderWidth: 1,
            titleColor: '#9aa3c7',
            bodyColor: '#f1ede2',
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#9aa3c7', font: { size: 11 } } },
          y: {
            grid: { color: 'rgba(255,255,255,0.08)' },
            ticks: { color: '#9aa3c7', font: { size: 10 }, callback: (v) => (v / 10000).toFixed(0) + '萬' },
          },
        },
      },
    });
    return () => { if (trendChartRef.current) trendChartRef.current.destroy(); };
  }, [trendData, hasCategoryHistory]);

  return (
    <>
      <section className="panel">
        <div className="panel-head">
          <h3>資產配置</h3>
          <span className="panel-total">{formatMoney(totalAssets)}</span>
        </div>
        {allocation.length === 0 ? (
          <p className="empty-note">還沒有資產資料，先到「資產」分頁新增幾筆吧。</p>
        ) : (
          <>
            <div className="chart-wrap" style={{ height: 220 }}><canvas ref={pieCanvasRef}></canvas></div>
            <ul className="legend-list">
              {allocation.map((entry) => (
                <li key={entry.name}>
                  <span className="legend-dot" style={{ background: entry.color }}></span>
                  <span className="legend-name">{entry.name}</span>
                  <span className="legend-value">
                    {formatMoney(entry.value)}（{((entry.value / totalAssets) * 100).toFixed(0)}%）
                  </span>
                </li>
              ))}
            </ul>
          </>
        )}
      </section>

      <section className="panel">
        <div className="panel-head">
          <h3>各分類歷史趨勢</h3>
        </div>
        {!hasCategoryHistory || trendData.length < 2 ? (
          <p className="empty-note">
            多按幾次「更新本週紀錄」，累積 2 週以上的分類資料後，這裡就會畫出各類別的走勢。
          </p>
        ) : (
          <div className="chart-wrap" style={{ height: 240 }}><canvas ref={trendCanvasRef}></canvas></div>
        )}
        <p className="privacy-note">
          分類趨勢是從你按下「更新本週紀錄」那一刻的資料算出來的，只有加上這個功能之後存的紀錄才會有分類明細，更早以前存的週紀錄不會補上。
        </p>
      </section>
    </>
  );
}

function HistoryPanel({ chartData, enrichedHistory, onSave, onDeleteEntry, onClearAll }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || chartData.length < 2) return;
    if (chartRef.current) chartRef.current.destroy();
    const ctx = canvasRef.current.getContext('2d');
    chartRef.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: chartData.map((d) => d.label),
        datasets: [{
          label: '淨值',
          data: chartData.map((d) => d.netWorth),
          borderColor: '#e8b355',
          backgroundColor: 'rgba(232,179,85,0.15)',
          tension: 0.35,
          pointBackgroundColor: '#e8b355',
          pointRadius: 3,
          fill: true,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: { label: (c) => formatMoney(c.parsed.y) },
            backgroundColor: '#1a2140',
            borderColor: 'rgba(255,255,255,0.1)',
            borderWidth: 1,
            titleColor: '#9aa3c7',
            bodyColor: '#f1ede2',
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#9aa3c7', font: { size: 11 } } },
          y: {
            grid: { color: 'rgba(255,255,255,0.08)' },
            ticks: { color: '#9aa3c7', font: { size: 10 }, callback: (v) => (v / 10000).toFixed(0) + '萬' },
          },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [chartData]);

  return (
    <section className="panel">
      <div className="panel-head">
        <h3>成長曲線</h3>
        <button className="save-btn" onClick={onSave}>💾 更新本週紀錄</button>
      </div>
      <p className="week-note">每週只會保留一筆紀錄，同一週內再次更新會覆蓋，不會重複累加。歸屬的「週」是看資產／負債項目裡最新的日期，不是你按下按鈕當下的日期。中間如果有幾週沒按更新（例如每月才操作一次），系統會自動用前一筆的數字補上那些週，成長曲線不會中斷，補上的週會標示「沿用」。</p>

      {chartData.length >= 2 ? (
        <div className="chart-wrap"><canvas ref={canvasRef}></canvas></div>
      ) : (
        <p className="empty-note">多更新幾週的紀錄，你的成長曲線就會顯示在這裡。</p>
      )}

      <ul className="log-list">
        {[...enrichedHistory].reverse().map((h) => (
          <li key={h.id}>
            <div>
              <span className="log-date">
                {toLocalDate(h.weekKey || getWeekKey(h.date)).toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' })} 那週
                {h.carried && <span className="log-carried-tag">沿用</span>}
              </span>
              <span className="log-net">{formatMoney(h.netWorth)}</span>
            </div>
            <div className="log-right">
              {h.delta !== 0 && (
                <span className={`log-delta ${h.delta > 0 ? 'tone-good' : 'tone-bad'}`}>
                  {h.delta > 0 ? '▲' : '▼'} {formatMoney(Math.abs(h.delta))}
                </span>
              )}
              {!h.carried && (
                <button className="del-btn" onClick={() => onDeleteEntry(h.id)} aria-label="刪除這筆紀錄">🗑</button>
              )}
            </div>
          </li>
        ))}
        {enrichedHistory.length === 0 && <p className="empty-note">還沒有任何週紀錄。</p>}
      </ul>

      {enrichedHistory.length > 0 && (
        <button className="ghost-btn danger full" onClick={onClearAll}>🗑 清空所有成長紀錄</button>
      )}
    </section>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<NetWorthAdventure />);
</script>
</body>
</html>
