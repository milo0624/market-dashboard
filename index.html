<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>資產冒險記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<style>
html, body { margin:0; padding:0; background:#10152a; }

.nwa-root {
  --bg-deep: #10152a;
  --bg-panel: #1a2140;
  --bg-panel-2: #212a4d;
  --text-primary: #f1ede2;
  --text-muted: #9aa3c7;
  --border: rgba(255,255,255,0.08);
  --gold: #e8b355;
  --good: #4fbe8e;
  --bad: #e8637a;

  font-family: 'Noto Sans TC', sans-serif;
  background: radial-gradient(circle at 50% 0%, #1b2247 0%, var(--bg-deep) 55%);
  color: var(--text-primary);
  padding: 28px 18px 48px;
  max-width: 560px;
  margin: 0 auto;
  box-sizing: border-box;
  min-height: 100vh;
}
.nwa-root * { box-sizing: border-box; }

.nwa-header { text-align:center; margin-bottom: 22px; position: relative; }
.eyebrow { font-size:11px; letter-spacing: 0.18em; text-transform:uppercase; color: var(--gold); margin:0 0 6px; font-weight:700; }
.nwa-header h1 { font-family:'Noto Serif TC', serif; font-weight:900; font-size:28px; margin:0 0 6px; letter-spacing: 0.04em; }
.subtitle { color: var(--text-muted); font-size:13px; margin:0; }

.hero-card {
  background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 22px 20px 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  margin-bottom: 16px;
}
.char-stage { width: min(220px, 62vw); aspect-ratio: 1/1; }
.species-picker { display:flex; gap:6px; margin-bottom:10px; }
.species-picker button { background: var(--bg-deep); border:1px solid var(--border); border-radius:999px; width:32px; height:32px; font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0.55; transition: all 0.2s; }
.species-picker button.active { opacity:1; border-color: rgba(232,179,85,0.5); background: rgba(232,179,85,0.1); transform: scale(1.08); }
.char-svg { width:100%; height:100%; }
.aura-ring { animation: pulse-ring 2.6s ease-in-out infinite; transform-origin: 100px 100px; }
@keyframes pulse-ring { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.sparkles .twinkle { animation: twinkle 1.8s ease-in-out infinite; transform-origin: center; }
@keyframes twinkle { 0%,100% { opacity:0.3; transform: scale(0.8); } 50% { opacity:1; transform: scale(1.15); } }

.char-idle { animation: idle-bob 3.2s ease-in-out infinite; transform-box: view-box; transform-origin: 100px 180px; }
@keyframes idle-bob { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(0.6deg); } }
.char-shadow { animation: shadow-breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes shadow-breathe { 0%,100% { transform: scaleX(1); opacity: 0.14; } 50% { transform: scaleX(0.92); opacity: 0.1; } }
.char-eye { animation: eye-blink 4.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes eye-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.15); } }

.lv-badge { margin-top: 4px; }
.lv-num { font-family:'Cinzel', serif; font-weight:700; font-size:14px; letter-spacing:0.06em; color: var(--gold); border: 1px solid rgba(232,179,85,0.4); padding: 3px 12px; border-radius: 999px; background: rgba(232,179,85,0.08); }
.char-title { font-family:'Noto Serif TC', serif; font-weight:900; font-size:22px; margin: 10px 0 6px; }
.char-percentile { font-size:11.5px; color: var(--text-muted); margin: 0 0 10px; display:flex; align-items:center; justify-content:center; gap:8px; }
.percentile-toggle { background:transparent; border:none; color: var(--text-muted); text-decoration:underline; font-size:10.5px; cursor:pointer; padding:0; font-family:inherit; }
.percentile-toggle.standalone { margin: 0 0 10px; text-decoration:none; border:1px solid var(--border); border-radius:999px; padding:3px 10px; }

.health-tag { display:inline-flex; align-items:center; gap:5px; font-size:12px; padding: 4px 12px; border-radius:999px; border:1px solid var(--border); color: var(--text-muted); margin-bottom: 16px; }
.health-tag.tone-great { color: var(--gold); border-color: rgba(232,179,85,0.4); }
.health-tag.tone-good { color: var(--good); border-color: rgba(79,190,142,0.35); }
.health-tag.tone-ok { color: #e8d081; border-color: rgba(232,208,129,0.3); }
.health-tag.tone-bad { color: var(--bad); border-color: rgba(232,99,122,0.35); }

.progress-wrap { width:100%; }
.progress-track { width:100%; height:8px; border-radius:999px; background: rgba(255,255,255,0.08); overflow:hidden; }
.progress-fill { height:100%; border-radius:999px; transition: width 0.5s ease; }
.progress-label { font-size:12px; color: var(--text-muted); margin: 8px 0 0; }

.stats-row { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom: 18px; }
.week-delta { display:flex; align-items:center; justify-content:center; gap:5px; font-size:12.5px; font-weight:600; margin: -8px 0 16px; }
.stat-card { background: var(--bg-panel); border:1px solid var(--border); border-radius:14px; padding: 12px 8px; text-align:center; }
.stat-card.highlight { background: linear-gradient(180deg, rgba(232,179,85,0.12), var(--bg-panel)); border-color: rgba(232,179,85,0.3); }
.stat-label { display:block; font-size:11px; color: var(--text-muted); margin-bottom:5px; }
.stat-value { display:block; font-size:14px; font-weight:700; font-family:'Noto Serif TC', serif; }
.stat-value.tone-good { color: var(--good); }
.stat-value.tone-bad { color: var(--bad); }

.tab-nav { display:flex; gap:6px; margin-bottom: 14px; background: var(--bg-panel); border:1px solid var(--border); border-radius: 14px; padding:4px; }
.tab-nav button { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:transparent; border:none; color: var(--text-muted); font-size:13px; font-weight:500; padding: 9px 6px; border-radius:10px; cursor:pointer; transition: all 0.2s; font-family: inherit; }
.tab-nav button.active { background: var(--bg-panel-2); color: var(--text-primary); box-shadow: 0 0 0 1px var(--border); }

.panel { background: var(--bg-panel); border:1px solid var(--border); border-radius:18px; padding: 18px; }
.panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
.panel-head h3 { margin:0; font-family:'Noto Serif TC', serif; font-size:16px; font-weight:700; }
.panel-total { font-weight:700; color: var(--gold); font-size:14px; }

.add-form { display:flex; flex-direction:column; gap:8px; margin-bottom: 16px; }
.add-form input, .add-form select { background: var(--bg-deep); border:1px solid var(--border); color: var(--text-primary); border-radius:10px; padding: 9px 10px; font-size:13px; font-family: inherit; min-width:0; }
.add-form input::placeholder { color: #5f6790; }
.add-form-name { width:100%; }
.add-form-name-row { display:flex; gap:8px; }
.add-form-name-row .add-form-name { flex:1; min-width:0; }
.add-form-date { width:132px; flex-shrink:0; }
.add-form-row { display:grid; grid-template-columns: 1fr 74px 1fr auto; gap:8px; align-items:start; }
.amount-field { display:flex; flex-direction:column; min-width:0; }
.amount-field input { width:100%; }
.amount-preview { font-size:10.5px; color: var(--good); margin: 3px 2px 0; }
.add-btn { background: var(--gold); border:none; color:#10152a; border-radius:10px; width:38px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; font-weight:700; }

.item-list, .log-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.item-list li { display:flex; align-items:center; justify-content:space-between; background: var(--bg-deep); border:1px solid var(--border); border-radius:12px; padding: 10px 12px; }
.item-info { display:flex; flex-direction:column; gap:2px; }
.item-name { font-size:13px; font-weight:500; }
.item-cat { font-size:11px; color: var(--text-muted); }
.item-date { font-size:10.5px; color: var(--text-muted); display:flex; align-items:center; gap:6px; }
.item-week-badge { font-size:9.5px; font-weight:700; color: var(--good); background: rgba(79,190,142,0.12); border:1px solid rgba(79,190,142,0.3); border-radius:999px; padding:1px 7px; }
.item-right { display:flex; align-items:center; gap:8px; }
.item-amount { font-size:13px; font-weight:700; }
.item-amount-block { display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
.item-amount-sub { font-size:10.5px; color: var(--text-muted); }
.del-btn { background:transparent; border:none; color: var(--text-muted); cursor:pointer; padding:4px; display:flex; font-size:14px; }
.del-btn:hover { color: var(--bad); }
.edit-btn { background:transparent; border:none; color: var(--text-muted); cursor:pointer; padding:4px; display:flex; font-size:14px; }
.edit-btn:hover { color: var(--gold); }

.item-edit-row { flex-direction:column; align-items:stretch; gap:8px; }
.item-edit-row > input[type="text"] { background: var(--bg-panel); border:1px solid var(--border); color: var(--text-primary); border-radius:10px; padding:9px 10px; font-size:13px; font-family:inherit; width:100%; }
.item-edit-fields { display:grid; grid-template-columns: 1fr 68px 1fr 1fr; gap:6px; }
.item-edit-fields select, .item-edit-fields input { background: var(--bg-panel); border:1px solid var(--border); color: var(--text-primary); border-radius:9px; padding:7px 8px; font-size:12px; font-family:inherit; min-width:0; }
.item-edit-actions { display:flex; gap:8px; justify-content:flex-end; }
.item-edit-actions .add-btn { width:auto; padding:0 14px; height:34px; }
.item-edit-actions .del-btn { border:1px solid var(--border); border-radius:10px; width:34px; height:34px; justify-content:center; }

.save-btn { display:flex; align-items:center; gap:6px; background: rgba(232,179,85,0.12); border:1px solid rgba(232,179,85,0.35); color: var(--gold); font-size:12px; font-weight:600; padding: 8px 12px; border-radius:10px; cursor:pointer; font-family: inherit; }
.save-btn.full { width:100%; justify-content:center; }
.privacy-note { font-size:11.5px; color: var(--text-muted); background: rgba(232,179,85,0.08); border:1px solid rgba(232,179,85,0.25); border-radius:10px; padding:9px 11px; margin: 0 0 16px; line-height:1.5; }
.backup-actions { display:flex; flex-direction:column; gap:8px; }

.insight-list { list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:10px; }
.insight-item { display:flex; gap:10px; align-items:flex-start; background: var(--bg-deep); border:1px solid var(--border); border-radius:12px; padding:12px; }
.insight-icon { flex-shrink:0; margin-top:1px; font-size:15px; }
.insight-title { font-size:13px; font-weight:700; margin:0 0 3px; }
.insight-text { font-size:12px; color: var(--text-muted); margin:0; line-height:1.5; }

.ai-advice-block { border-top:1px solid var(--border); padding-top:14px; margin-top:4px; }
.ai-advice-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.ai-advice-list li { font-size:12.5px; color: var(--text-primary); line-height:1.6; background: var(--bg-deep); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.week-note { font-size:11.5px; color: var(--text-muted); margin: 0 0 14px; }

.chart-wrap { margin: 4px 0 16px; height: 200px; }
.legend-list { list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:8px; }
.legend-list li { display:flex; align-items:center; gap:8px; background: var(--bg-deep); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-size:12px; }
.legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; display:inline-block; }
.legend-name { flex:1; color: var(--text-primary); }
.legend-value { color: var(--text-muted); }
.log-list li { display:flex; align-items:center; justify-content:space-between; background: var(--bg-deep); border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
.log-date { display:block; font-size:11px; color: var(--text-muted); }
.log-net { display:block; font-size:13px; font-weight:700; margin-top:2px; }
.log-delta { display:flex; align-items:center; gap:3px; font-size:12px; font-weight:600; }
.log-delta.tone-good { color: var(--good); }
.log-delta.tone-bad { color: var(--bad); }
.log-right { display:flex; align-items:center; gap:8px; }
.log-carried-tag { font-size:9.5px; font-weight:600; color: var(--text-muted); background: rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:999px; padding:1px 7px; margin-left:6px; }

.empty-note { color: var(--text-muted); font-size:13px; text-align:center; padding: 18px 0; }

.import-row { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
.import-hint { font-size:11px; color: var(--text-muted); }
.import-msg { font-size:11.5px; color: var(--good); margin: 0 0 12px; }
.house-query-row { display:flex; gap:8px; margin-bottom:12px; }
.house-query-row input, .house-query-row select { flex:1; min-width:0; background: var(--bg-deep); border:1px solid var(--border); color: var(--text-primary); border-radius:10px; padding:9px 10px; font-size:13px; font-family:inherit; }
.stock-shares-input { max-width:88px; flex:none !important; }

.rate-bar { background: var(--bg-panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:16px; }
.rate-bar-top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.ghost-btn.small { flex:none; display:flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--border); color: var(--text-muted); font-size:11px; padding:6px 10px; border-radius:10px; cursor:pointer; font-family:inherit; }
.ghost-btn.full { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; background:transparent; border:1px solid var(--border); color: var(--text-muted); font-size:12px; padding:9px; border-radius:10px; cursor:pointer; font-family:inherit; margin-top:14px; }
.ghost-btn.danger:hover { color: var(--bad); border-color: rgba(232,99,122,0.35); }
.rate-updated { font-size:11px; color: var(--text-muted); }
.rate-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.rate-chip { font-size:11px; color: var(--text-muted); background: var(--bg-deep); border:1px solid var(--border); border-radius:999px; padding:3px 9px; }
.rate-error { color: var(--bad); font-size:11px; margin: 8px 0 0; }
.team-error { color: var(--bad); font-size:12px; margin: 0 0 12px; }
.spin { display:inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .aura-ring, .twinkle, .spin, .char-idle, .char-shadow, .char-eye { animation: none !important; }
}
</style>
</head>

const CURRENCIES = [
  { code: 'TWD', label: '新台幣', symbol: 'NT$', rate: 1 },
  { code: 'USD', label: '美元', symbol: 'US$', rate: 31 },
  { code: 'JPY', label: '日圓', symbol: 'JP¥', rate: 0.21 },

];

function getCurrency(code) {
  return CURRENCIES.find((c) => c.code === code) || CURRENCIES[0];
}

function getLevel(netWorth, levels = LEVELS) {
  return levels.find((l) => netWorth >= l.min && netWorth < l.max) || levels[levels.length - 1];
}

function getHealth(totalAssets, totalLiabilities) {
  if (totalLiabilities <= 0) return { tone: 'great', label: '無債一身輕' };
  const ratio = totalAssets > 0 ? totalLiabilities / totalAssets : 1;
  if (ratio < 0.3) return { tone: 'good', label: '體質健康', ratio };
  if (ratio < 0.6) return { tone: 'ok', label: '穩定平衡', ratio };
  return { tone: 'bad', label: '負擔有點吃緊', ratio };
}

function getProgress(netWorth, level, levels = LEVELS) {
  if (level.id === 8) return { percent: 100, label: '已達巔峰境界' };
  if (level.id === 1) {
    const floor = -500000;
    const percent = Math.max(0, Math.min(100, ((netWorth - floor) / (0 - floor)) * 100));
    return { percent, label: `距離轉正還差 ${formatMoney(0 - netWorth)}` };
  }
  const next = levels[level.id];
  const percent = Math.max(0, Math.min(100, ((netWorth - level.min) / (level.max - level.min)) * 100));
  return { percent, label: `距離 Lv.${next.id}「${next.title}」還差 ${formatMoney(level.max - netWorth)}` };
}

function formatMoney(n, code = 'TWD') {
  const c = getCurrency(code);
  const sign = n < 0 ? '-' : '';
  const formatted = Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
  return `${sign}${c.symbol} ${formatted}`;
}

function evaluateExpr(str) {
  if (!str) return NaN;
  const trimmed = String(str).trim();
  if (!trimmed) return NaN;
  if (!/^[0-9+\-*/(). ]+$/.test(trimmed)) return NaN;
  try {
    let i = 0;
    const skip = () => {
      while (trimmed[i] === ' ') i++;
    };
    const parseExpr = () => {
      let value = parseTerm();
      skip();
      while (trimmed[i] === '+' || trimmed[i] === '-') {
        const op = trimmed[i];
        i++;
        const rhs = parseTerm();
        value = op === '+' ? value + rhs : value - rhs;
        skip();
      }
      return value;
    };
    const parseTerm = () => {
      let value = parseFactor();
      skip();
      while (trimmed[i] === '*' || trimmed[i] === '/') {
        const op = trimmed[i];
        i++;
        const rhs = parseFactor();
        value = op === '*' ? value * rhs : value / rhs;
        skip();
      }
      return value;
    };
    const parseFactor = () => {
      skip();
      if (trimmed[i] === '-') {
        i++;
        return -parseFactor();
      }
      if (trimmed[i] === '+') {
        i++;
        return parseFactor();
      }
      if (trimmed[i] === '(') {
        i++;
        const value = parseExpr();
        skip();
        if (trimmed[i] !== ')') throw new Error('expected )');
        i++;
        return value;
      }
      const start = i;
      while (i < trimmed.length && /[0-9.]/.test(trimmed[i])) i++;
      if (start === i) throw new Error('expected number');
      const num = parseFloat(trimmed.slice(start, i));
      if (Number.isNaN(num)) throw new Error('bad number');
      return num;
    };
    skip();
    const result = parseExpr();
    skip();
    if (i !== trimmed.length) throw new Error('trailing characters');
    if (typeof result !== 'number' || !isFinite(result)) throw new Error('not finite');
    return result;
  } catch (e) {
    return NaN;
  }
}

function computeCategoryBreakdown(itemsTWD, categories) {
  const breakdown = {};
  categories.forEach((c) => {
    breakdown[c] = 0;
  });
  itemsTWD.forEach((item) => {
    const cat = categories.includes(item.category) ? item.category : categories[0];
    breakdown[cat] = (breakdown[cat] || 0) + item.twd;
  });
  return breakdown;
}

let twseStockListCache = null;

function parseCsvLine(line) {
  // 欄位皆以雙引號包住、用逗號分隔（例如 "2330","台積電","2410.00"），
  // 股票名稱本身不含逗號，直接用正規表示式取出每個引號內的內容即可。
  return (line.match(/"([^"]*)"/g) || []).map((s) => s.slice(1, -1));
}

async function fetchTWSEStockList() {
  if (twseStockListCache) return twseStockListCache;
  // openapi.twse.com.tw 的 JSON 版本沒有回傳 CORS 標頭（Access-Control-Allow-Origin），
  // 瀏覽器端 fetch 會直接被擋下來，所以改用有開放 CORS 的舊版 CSV 端點，自行解析文字內容。
  const res = await fetch('https://www.twse.com.tw/exchangeReport/STOCK_DAY_ALL?response=json');
  const text = await res.text();
  const lines = text.trim().split('\n').filter(Boolean);
  const map = {};
  lines.slice(1).forEach((line) => {
    const cols = parseCsvLine(line);
    const [, code, name, , , , , , closingPrice] = cols;
    if (code) {
      map[code] = { price: parseFloat(String(closingPrice).replace(/,/g, '')), name };
    }
  });
  twseStockListCache = map;
  return map;
}

async function fetchStockPriceTWSE(ticker) {
  const map = await fetchTWSEStockList();
  const entry = map[ticker];
  if (!entry || !entry.price || !isFinite(entry.price) || entry.price <= 0) {
    throw new Error('not-found');
  }
  return { price: entry.price, name: entry.name || ticker, currency: 'TWD' };
}

/* ------------------------- 內政部實價登錄房價查詢 ------------------------- */
// 資料來源：內政部不動產交易實價查詢服務網開放資料（有開放 CORS），
// 每季一個 zip，內含全台 22 縣市的「不動產買賣」CSV。用 fflate 在瀏覽器端解壓縮，
// 只取需要的那個縣市檔案，避免整包 236 個檔案都解開。
const PING_IN_SQM = 3.305785;

function currentRocSeason() {
  const now = new Date();
  return { year: now.getFullYear() - 1911, quarter: Math.floor(now.getMonth() / 3) + 1 };
}
function prevRocSeason(season) {
  return season.quarter === 1
    ? { year: season.year - 1, quarter: 4 }
    : { year: season.year, quarter: season.quarter - 1 };
}
function seasonCode(season) {
  return `${season.year}S${season.quarter}`;
}

const lvrSeasonZipCache = {}; // 季度 -> ArrayBuffer｜null（本次頁面存活期間有效，null 代表該季尚未公布）

async function getLvrSeasonZipBuffer(season) {
  if (season in lvrSeasonZipCache) return lvrSeasonZipCache[season];
  const res = await fetch(`https://plvr.land.moi.gov.tw/DownloadSeason?season=${season}&fileName=lvr_landcsv.zip`);
  const buf = await res.arrayBuffer();
  // 尚未公布的季度會回傳一小段「系統訊息」HTML，不是真正的 zip，用大小簡單判斷。
  const result = buf.byteLength < 5000 ? null : buf;
  lvrSeasonZipCache[season] = result;
  return result;
}

function aggregateLvrCsv(csvText) {
  const lines = csvText.split('\n');
  const agg = {};
  for (let i = 2; i < lines.length; i++) {
    const line = lines[i];
    if (!line.trim()) continue;
    const cols = line.split(',');
    const district = cols[0];
    const dealType = cols[1];
    const unitPricePerSqm = parseFloat(cols[22]);
    if (!district || !dealType || !dealType.includes('房地')) continue;
    if (!isFinite(unitPricePerSqm) || unitPricePerSqm <= 0) continue;
    if (!agg[district]) agg[district] = { sum: 0, count: 0 };
    agg[district].sum += unitPricePerSqm;
    agg[district].count += 1;
  }
  return agg;
}

async function getCountySeasonAggregate(season, code) {
  const cacheKey = `nw-lvr-agg-${season}-${code}`;
  const cached = storageGet(cacheKey);
  if (cached) return cached;
  const buf = await getLvrSeasonZipBuffer(season);
  if (!buf) return null;
  const targetName = `${code}_lvr_land_a.csv`;
  const files = fflate.unzipSync(new Uint8Array(buf), { filter: (f) => f.name === targetName });
  const bytes = files[targetName];
  if (!bytes) return null;
  const text = fflate.strFromU8(bytes);
  const agg = aggregateLvrCsv(text);
  storageSet(cacheKey, agg);
  return agg;
}

// 抓「最近一年」＝最近 4 個已公布的季度。內政部的下載伺服器本身速度不快（一季壓縮檔約
// 14MB，抓一次常常要 5～10 秒），所以多抓 2 季當備援（最新一季可能還沒公布）、
// 同時平行下載，而不是抓完一季再抓下一季，藉此縮短等待時間。
async function fetchDistrictYearlyPrice(countyName, district) {
  const info = TAIWAN_DISTRICTS[countyName];
  if (!info) throw new Error('unknown-county');
  let season = currentRocSeason();
  const candidateSeasons = [];
  for (let i = 0; i < 6; i++) {
    candidateSeasons.push(seasonCode(season));
    season = prevRocSeason(season);
  }
  const results = await Promise.all(
    candidateSeasons.map((code) => getCountySeasonAggregate(code, info.code).catch(() => null))
  );
  const usedSeasons = [];
  let sum = 0;
  let count = 0;
  for (let i = 0; i < results.length && usedSeasons.length < 4; i++) {
    const agg = results[i];
    if (!agg) continue;
    usedSeasons.push(candidateSeasons[i]);
    const d = agg[district];
    if (d) {
      sum += d.sum;
      count += d.count;
    }
  }
  if (usedSeasons.length === 0) throw new Error('no-season-data');
  if (count === 0) return { pricePerPing: null, count: 0, seasons: usedSeasons };
  const avgPerSqm = sum / count;
  return { pricePerPing: avgPerSqm * PING_IN_SQM, count, seasons: usedSeasons };
}

function uid() {
  return `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
}

function dedupeItems(list) {
  const groups = {};
  list.forEach((item) => {
    if (!groups[item.name]) groups[item.name] = [];
    groups[item.name].push(item);
  });
  const kept = [];
  let removed = 0;
  Object.values(groups).forEach((group) => {
    if (group.length === 1) {
      kept.push(group[0]);
      return;
    }
    const sorted = [...group].sort((a, b) => {
      const ad = a.date || '';
      const bd = b.date || '';
      if (ad !== bd) return ad < bd ? 1 : -1;
      return 0;
    });
    kept.push(sorted[0]);
    removed += group.length - 1;
  });
  return { kept, removed };
}

function generateInsights({ assetsTWD, liabilitiesTWD, totalAssets, totalLiabilities, health, history }) {
  const tips = [];

  if (totalLiabilities <= 0) {
    tips.push({
      tone: 'good',
      title: '目前沒有負債',
      text: '財務體質不錯，可以考慮把多餘資金分配到緊急預備金，或報酬率較高的投資工具上。',
    });
  } else if (health.tone === 'bad') {
    tips.push({
      tone: 'bad',
      title: '負債比偏高',
      text: '負債占資產比重較高，一般建議優先償還利率最高的負債（例如信用卡循環息、信貸），並暫緩非必要的新支出或借貸。',
    });
  } else if (health.tone === 'ok') {
    tips.push({
      tone: 'ok',
      title: '負債比中等',
      text: '負債比例還在可控範圍，持續留意每月還款進度，避免再新增高利率負債。',
    });
  } else {
    tips.push({
      tone: 'good',
      title: '負債狀況相對健康',
      text: '負債占比不高，可以考慮把餘裕資金做更有效率的配置。',
    });
  }

  const highInterest = liabilitiesTWD.filter((l) => l.category === '信貸 / 卡債');
  if (highInterest.length > 0) {
    const sum = highInterest.reduce((s, l) => s + l.twd, 0);
    tips.push({
      tone: 'bad',
      title: '留意高利率負債',
      text: `信貸／卡債合計約 ${formatMoney(sum)}，這類負債利率通常偏高，一般會建議列為優先清償項目。`,
    });
  }

  const cashTotal = assetsTWD.filter((a) => a.category === '現金 / 存款').reduce((s, a) => s + a.twd, 0);
  const cashRatio = totalAssets > 0 ? cashTotal / totalAssets : 0;
  if (totalAssets > 0 && cashRatio < 0.1) {
    tips.push({
      tone: 'ok',
      title: '流動資金偏低',
      text: '現金／存款占總資產比重偏低，一般建議保留約 3–6 個月生活開銷的現金，作為緊急預備金。',
    });
  }

  const categoryTotals = {};
  assetsTWD.forEach((a) => {
    categoryTotals[a.category] = (categoryTotals[a.category] || 0) + a.twd;
  });
  const sortedCategories = Object.entries(categoryTotals).sort((a, b) => b[1] - a[1]);
  if (sortedCategories.length > 1 && totalAssets > 0 && sortedCategories[0][1] / totalAssets > 0.7) {
    const [topName, topSum] = sortedCategories[0];
    tips.push({
      tone: 'ok',
      title: '資產集中度偏高',
      text: `「${topName}」占總資產約 ${((topSum / totalAssets) * 100).toFixed(0)}%，可以考慮適度分散到其他資產類別，降低單一類別波動對整體淨值的影響。`,
    });
  }

  if (history.length >= 2) {
    const last = history[history.length - 1];
    const prev = history[history.length - 2];
    const change = last.netWorth - prev.netWorth;
    if (change > 0) {
      tips.push({
        tone: 'good',
        title: '淨值持續成長',
        text: `上週到這週淨值增加了約 ${formatMoney(change)}，保持這個節奏！`,
      });
    } else if (change < 0) {
      tips.push({
        tone: 'bad',
        title: '淨值較上週下降',
        text: `這週淨值比上週減少約 ${formatMoney(Math.abs(change))}，可以檢視一下這段期間的支出或負債變化。`,
      });
    }
  }

  if (tips.length === 0) {
    tips.push({

// 用「本地時區」的年月日格式化，而不是 toISOString()（那個是 UTC 時間）。
// 台灣是 UTC+8，如果用 toISOString() 來判斷「今天」，每天 00:00–08:00 這段時間
// 會誤判成前一天，連帶影響「本週」的判斷（半夜剛過 0 點還會被算進上一週）。
function localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// 把「YYYY-MM-DD」這種純日期字串，當成本地日期解析（而不是交給 new Date() 當 UTC 午夜解析），
// 避免時區造成的日期偏移；其他格式（含時間的 ISO 字串等）則照常交給 new Date() 處理。
function toLocalDate(dateInput) {
  if (typeof dateInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateInput)) {
    const [y, m, day] = dateInput.split('-').map(Number);
    return new Date(y, m - 1, day);
  }
  return new Date(dateInput);
}

function getWeekKey(dateInput) {
  const d = toLocalDate(dateInput);
  d.setHours(0, 0, 0, 0);
  const day = d.getDay();
  d.setDate(d.getDate() - day);
  return localDateStr(d);
}

function todayStr() {
  return localDateStr(new Date());
}

function normalizeDate(value) {
  if (!value) return todayStr();
  if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
  if (value instanceof Date && !isNaN(value)) return localDateStr(value);
  const parsed = new Date(value);
  if (!isNaN(parsed)) return localDateStr(parsed);
  return todayStr();
}

function parseExcelRows(rows, currentType) {
  const assetRows = [];
  const liabilityRows = [];
  let skipped = 0;
  rows.forEach((row) => {
    const name = String(row['名稱'] ?? row['name'] ?? row['Name'] ?? '').trim();
    const amountRaw = row['金額'] ?? row['amount'] ?? row['Amount'];
    const amount = parseFloat(amountRaw);
    if (!name || !amount || amount <= 0) {
      skipped++;
      return;
    }
    const categoryRaw = String(row['分類'] ?? row['category'] ?? row['Category'] ?? '').trim();
    let currency = String(row['幣別'] ?? row['currency'] ?? row['Currency'] ?? 'TWD').trim().toUpperCase();
    if (!CURRENCIES.find((c) => c.code === currency)) currency = 'TWD';
    const date = normalizeDate(row['日期'] ?? row['date'] ?? row['Date']);

    if (LIABILITY_CATEGORIES.includes(categoryRaw)) {
      liabilityRows.push({ name, category: categoryRaw, currency, amount, date });
    } else if (ASSET_CATEGORIES.includes(categoryRaw)) {
      assetRows.push({ name, category: categoryRaw, currency, amount, date });
    } else if (currentType === 'liability') {
      liabilityRows.push({ name, category: LIABILITY_CATEGORIES[0], currency, amount, date });
    } else {
      assetRows.push({ name, category: ASSET_CATEGORIES[0], currency, amount, date });
    }
  });
  return { assetRows, liabilityRows, skipped };
}

function storageGet(key) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  } catch (e) {
    return null;
  }
}
function storageSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.error('儲存失敗', e);
  }
}

  );

function NetWorthAdventure() {
  const [assets, setAssets] = useState(() => {
    const d = storageGet('nw-data');
    return d && Array.isArray(d.assets) ? d.assets : [];
  });
  const [liabilities, setLiabilities] = useState(() => {
    const d = storageGet('nw-data');
    return d && Array.isArray(d.liabilities) ? d.liabilities : [];
  });
  const [history, setHistory] = useState(() => storageGet('nw-history') || []);
  const [tab, setTab] = useState('assets');
  const [species, setSpecies] = useState(() => storageGet('nw-species') || 'seal');
  const [showPercentile, setShowPercentile] = useState(() => {
    const v = storageGet('nw-show-percentile');
    return v === null ? true : v;
  });

  const [assetForm, setAssetForm] = useState({ name: '', category: ASSET_CATEGORIES[0], amount: '', currency: 'TWD', date: todayStr() });
  const [liabForm, setLiabForm] = useState({ name: '', category: LIABILITY_CATEGORIES[0], amount: '', currency: 'TWD', date: todayStr() });
  const [knownAssetItems, setKnownAssetItems] = useState(() => storageGet('nw-known-assets') || []);
  const [knownLiabilityItems, setKnownLiabilityItems] = useState(() => storageGet('nw-known-liabilities') || []);
  const [liveRates, setLiveRates] = useState(() => storageGet('nw-live-rates') || null);
  const [ratesLoading, setRatesLoading] = useState(false);
  const [ratesError, setRatesError] = useState('');
  const [downloadsCap, setDownloadsCap] = useState(null);

  useEffect(() => {
    let mounted = true;
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then((d) => {
        if (mounted) setDownloadsCap(d);
      }).catch(() => {});
    }
    return () => {
      mounted = false;
    };
  }, []);

  useEffect(() => {
    storageSet('nw-species', species);
  }, [species]);

  useEffect(() => {
    storageSet('nw-show-percentile', showPercentile);
  }, [showPercentile]);

  useEffect(() => {
    storageSet('nw-data', { assets, liabilities });
  }, [assets, liabilities]);

  const getEffectiveRate = (code) => {
    if (code === 'TWD') return 1;
    if (liveRates && typeof liveRates[code] === 'number') return liveRates[code];
    return getCurrency(code).rate;
  };

  const fetchLiveRates = async () => {
    setRatesLoading(true);
    setRatesError('');
    try {
      const res = await fetch('https://api.frankfurter.dev/v2/rates?quotes=USD,JPY,CNY,EUR,HKD,TWD');
      const rows = await res.json();
      const map = { EUR: 1 };
      (Array.isArray(rows) ? rows : []).forEach((r) => {
        if (r && r.quote && typeof r.rate === 'number') map[r.quote] = r.rate;
      });
      const twdPerEur = map.TWD;
      if (!twdPerEur || !map.USD || !map.JPY || !map.CNY || !map.HKD) throw new Error('missing-rate');
      const rates = {
        USD: twdPerEur / map.USD,
        JPY: twdPerEur / map.JPY,
        CNY: twdPerEur / map.CNY,
        EUR: twdPerEur,
        HKD: twdPerEur / map.HKD,
        updatedAt: new Date().toISOString(),
      };
      setLiveRates(rates);
      storageSet('nw-live-rates', rates);
    } catch (e) {
      setRatesError('取得即時匯率失敗，暫時使用預設參考匯率');
    }
    setRatesLoading(false);
  };

  const totalAssets = useMemo(
    () => assets.reduce((s, i) => s + (i.currency && i.currency !== 'TWD' ? i.amount * getEffectiveRate(i.currency) : i.amount), 0),
    [assets, liveRates]
  );
  const totalLiabilities = useMemo(
    () => liabilities.reduce((s, i) => s + (i.currency && i.currency !== 'TWD' ? i.amount * getEffectiveRate(i.currency) : i.amount), 0),
    [liabilities, liveRates]
  );
  const netWorth = totalAssets - totalLiabilities;
  const level = getLevel(netWorth);
  const health = getHealth(totalAssets, totalLiabilities);
  const progress = getProgress(netWorth, level);
  const mood = netWorth < 0 || health.tone === 'bad' ? 'sad' : health.tone === 'ok' ? 'neutral' : 'happy';

  const assetsTWD = useMemo(
    () => assets.map((a) => ({ ...a, twd: a.currency && a.currency !== 'TWD' ? a.amount * getEffectiveRate(a.currency) : a.amount })),
    [assets, liveRates]
  );
  const liabilitiesTWD = useMemo(
    () => liabilities.map((l) => ({ ...l, twd: l.currency && l.currency !== 'TWD' ? l.amount * getEffectiveRate(l.currency) : l.amount })),
    [liabilities, liveRates]
  );
  const insights = useMemo(
    () => generateInsights({ assetsTWD, liabilitiesTWD, totalAssets, totalLiabilities, health, history }),
    [assetsTWD, liabilitiesTWD, totalAssets, totalLiabilities, health, history]
  );

  const latestItemDate = useMemo(() => {
    const dates = [...assets, ...liabilities].map((i) => i.date).filter(Boolean);
    if (dates.length === 0) return todayStr();
    return dates.reduce((max, d) => (d > max ? d : max), dates[0]);
  }, [assets, liabilities]);

  const sortedHistory = useMemo(() => {
    return [...history].sort((a, b) => {
      const ak = a.weekKey || getWeekKey(a.date);
      const bk = b.weekKey || getWeekKey(b.date);
      return ak < bk ? -1 : ak > bk ? 1 : 0;
    });
  }, [history]);

  // 有些週沒有手動按「更新本週紀錄」（例如每月才操作一次）時，在兩筆真實紀錄之間
  // 自動補上「沿用上一筆」的週紀錄，讓成長曲線與清單不會出現空白週。這些補上的
  // 項目只在畫面上顯示，不會寫回 history 儲存，真正的資料仍以使用者手動存檔為準。
  const sortedHistoryFilled = useMemo(() => {
    const filled = [];
    sortedHistory.forEach((entry) => {
      const entryKey = entry.weekKey || getWeekKey(entry.date);
      if (filled.length > 0) {
        let prev = filled[filled.length - 1];
        let cursor = toLocalDate(prev.weekKey || getWeekKey(prev.date));
        cursor.setDate(cursor.getDate() + 7);
        let cursorKey = localDateStr(cursor);
        while (cursorKey < entryKey) {
          const carried = { ...prev, id: `carried-${cursorKey}`, weekKey: cursorKey, date: cursor.toISOString(), carried: true };
          filled.push(carried);
          prev = carried;
          cursor.setDate(cursor.getDate() + 7);
          cursorKey = localDateStr(cursor);
        }
      }
      filled.push(entry);
    });
    return filled;
  }, [sortedHistory]);

  const lastCompletedEntry = useMemo(() => {
    const currentWeekKey = getWeekKey(latestItemDate);
    return [...sortedHistoryFilled].reverse().find((h) => (h.weekKey || getWeekKey(h.date)) !== currentWeekKey) || null;
  }, [sortedHistoryFilled, latestItemDate]);
  const weeklyChange = lastCompletedEntry ? netWorth - lastCompletedEntry.netWorth : null;

  const currentAssetAllocation = useMemo(() => {
    const breakdown = computeCategoryBreakdown(assetsTWD, ASSET_CATEGORIES);
    return ASSET_CATEGORIES.map((c) => ({ name: c, value: breakdown[c], color: ASSET_CATEGORY_COLORS[c] })).filter(
      (d) => d.value > 0
    );
  }, [assetsTWD]);

  const categoryTrendData = useMemo(() => {
    return sortedHistoryFilled.map((h) => ({
      label: toLocalDate(h.weekKey || getWeekKey(h.date)).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' }),
      values: ASSET_CATEGORIES.reduce((acc, c) => {
        acc[c] = h.assetsByCategory ? h.assetsByCategory[c] ?? null : null;
        return acc;
      }, {}),
    }));
  }, [sortedHistoryFilled]);
  const hasCategoryHistory = sortedHistoryFilled.some((h) => h.assetsByCategory);

  const upsertKnownItem = (list, entry) => {
    const idx = list.findIndex((i) => i.name === entry.name);
    if (idx >= 0) {
      const next = [...list];
      next[idx] = entry;
      return next;
    }
    return [...list, entry];
  };

  const addItem = (type) => {
    const form = type === 'asset' ? assetForm : liabForm;
    const amount = evaluateExpr(form.amount);
    if (!form.name.trim() || !amount || amount <= 0) return null;
    const trimmedName = form.name.trim();
    const rawList = type === 'asset' ? assets : liabilities;
    const list = Array.isArray(rawList) ? rawList : [];
    let existing = null;
    try {
      existing = list.find((i) => i && i.name === trimmedName) || null;
    } catch (e) {
      existing = null;
    }
    const date = form.date || todayStr();

    if (existing) {
      editItem(type, existing.id, { name: trimmedName, category: form.category, currency: form.currency, amount, date });
      if (type === 'asset') {
        setAssetForm({ name: '', category: assetForm.category, amount: '', currency: assetForm.currency, date: assetForm.date });
      } else {
        setLiabForm({ name: '', category: liabForm.category, amount: '', currency: liabForm.currency, date: liabForm.date });
      }
      return { updated: true, name: trimmedName };
    }

    const item = { id: uid(), name: trimmedName, category: form.category, currency: form.currency, amount, date };
    if (type === 'asset') {
      setAssets((prev) => [...prev, item]);
      setAssetForm({ name: '', category: assetForm.category, amount: '', currency: assetForm.currency, date: assetForm.date });
      const nextKnown = upsertKnownItem(knownAssetItems, { name: item.name, category: item.category, currency: item.currency });
      setKnownAssetItems(nextKnown);
      storageSet('nw-known-assets', nextKnown);
    } else {
      setLiabilities((prev) => [...prev, item]);
      setLiabForm({ name: '', category: liabForm.category, amount: '', currency: liabForm.currency, date: liabForm.date });
      const nextKnown = upsertKnownItem(knownLiabilityItems, { name: item.name, category: item.category, currency: item.currency });
      setKnownLiabilityItems(nextKnown);
      storageSet('nw-known-liabilities', nextKnown);
    }
    return { updated: false, name: trimmedName };
  };

  const removeItem = (type, id) => {
    if (type === 'asset') setAssets((prev) => prev.filter((i) => i.id !== id));
    else setLiabilities((prev) => prev.filter((i) => i.id !== id));
  };

  const editItem = (type, id, updates) => {
    if (type === 'asset') {
      setAssets((prev) => prev.map((i) => (i.id === id ? { ...i, ...updates } : i)));
      const nextKnown = upsertKnownItem(knownAssetItems, { name: updates.name, category: updates.category, currency: updates.currency });
      setKnownAssetItems(nextKnown);
      storageSet('nw-known-assets', nextKnown);
    } else {
      setLiabilities((prev) => prev.map((i) => (i.id === id ? { ...i, ...updates } : i)));
      const nextKnown = upsertKnownItem(knownLiabilityItems, { name: updates.name, category: updates.category, currency: updates.currency });
      setKnownLiabilityItems(nextKnown);
      storageSet('nw-known-liabilities', nextKnown);
    }
  };

  const cleanupDuplicates = (type) => {
    const list = type === 'asset' ? assets : liabilities;
    const setList = type === 'asset' ? setAssets : setLiabilities;
    const { kept, removed } = dedupeItems(list);
    if (removed > 0) setList(kept);
    return { removed };
  };

  const addStockHolding = async (ticker, shares) => {
    const { price, name, currency } = await fetchStockPriceTWSE(ticker);
    const amount = shares * price;
    const displayName = `${name}（${ticker}）`;
    const nowIso = new Date().toISOString();
    const existing = assets.find((a) => a.ticker === ticker);
    if (existing) {
      editItem('asset', existing.id, {
        name: displayName,
        category: '股票 / 基金',
        currency,
        amount,
        date: todayStr(),
        ticker,
        shares,
        priceUpdatedAt: nowIso,
      });
      return { updated: true, name };
    }
    const item = {
      id: uid(),
      name: displayName,
      category: '股票 / 基金',
      currency,
      amount,
      date: todayStr(),
      ticker,
      shares,
      priceUpdatedAt: nowIso,
    };
    setAssets((prev) => [...prev, item]);
    const nextKnown = upsertKnownItem(knownAssetItems, { name: item.name, category: item.category, currency: item.currency });
    setKnownAssetItems(nextKnown);
    storageSet('nw-known-assets', nextKnown);
    return { updated: false, name };
  };

  const addHouseAsset = (name, amount) => {
    const item = {
      id: uid(),
      name,
      category: '房地產',
      currency: 'TWD',
      amount,
      date: todayStr(),
    };
    setAssets((prev) => [...prev, item]);
    const nextKnown = upsertKnownItem(knownAssetItems, { name: item.name, category: item.category, currency: item.currency });
    setKnownAssetItems(nextKnown);
    storageSet('nw-known-assets', nextKnown);
  };

  const refreshStockHolding = async (itemId) => {
    const item = assets.find((a) => a.id === itemId);
    if (!item || !item.ticker) return;
    const { price, name, currency } = await fetchStockPriceTWSE(item.ticker);
    editItem('asset', itemId, {
      name: `${name}（${item.ticker}）`,
      amount: item.shares * price,
      currency,
      date: todayStr(),
      priceUpdatedAt: new Date().toISOString(),
    });
  };

  const refreshAllHoldings = async () => {
    const holdings = assets.filter((a) => a.ticker);
    for (const h of holdings) {
      try {
        await refreshStockHolding(h.id);
      } catch (e) {
        /* 單一檔更新失敗就跳過，繼續更新其他檔 */
      }
    }
  };

  const importItems = (type, rows) => {
    const list = type === 'asset' ? assets : liabilities;
    const setList = type === 'asset' ? setAssets : setLiabilities;
    const knownList = type === 'asset' ? knownAssetItems : knownLiabilityItems;
    const setKnown = type === 'asset' ? setKnownAssetItems : setKnownLiabilityItems;
    const knownKey = type === 'asset' ? 'nw-known-assets' : 'nw-known-liabilities';

    const workingList = [...list];
    let nextKnown = knownList;
    let addedCount = 0;
    let updatedCount = 0;

    rows.forEach((r) => {
      const idx = workingList.findIndex((i) => i.name === r.name);
      if (idx >= 0) {
        workingList[idx] = { ...workingList[idx], ...r };
        updatedCount++;
      } else {
        workingList.push({ id: uid(), ...r });
        addedCount++;
      }
      nextKnown = upsertKnownItem(nextKnown, { name: r.name, category: r.category, currency: r.currency });
    });

    setList(workingList);
    setKnown(nextKnown);
    storageSet(knownKey, nextKnown);
    return { addedCount, updatedCount };
  };

  const handleImportFile = async (file, currentType) => {
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      const { assetRows, liabilityRows, skipped } = parseExcelRows(rows, currentType);
      let assetResult = { addedCount: 0, updatedCount: 0 };
      let liabilityResult = { addedCount: 0, updatedCount: 0 };
      if (assetRows.length > 0) assetResult = importItems('asset', assetRows);
      if (liabilityRows.length > 0) liabilityResult = importItems('liability', liabilityRows);
      return {
        assetAdded: assetResult.addedCount,
        assetUpdated: assetResult.updatedCount,
        liabilityAdded: liabilityResult.addedCount,
        liabilityUpdated: liabilityResult.updatedCount,
        skipped,
      };
    } catch (err) {
      return { error: '讀取檔案失敗，請確認檔案格式是否正確' };
    }
  };

  const [backupMsg, setBackupMsg] = useState('');

  const exportBackup = async () => {
    const backup = {
      version: 1,
      exportedAt: new Date().toISOString(),
      assets,
      liabilities,
      history,
      knownAssetItems,
      knownLiabilityItems,
    };
    const filename = `資產冒險記備份_${new Date().toISOString().slice(0, 10)}.json`;
    const json = JSON.stringify(backup, null, 2);

    if (downloadsCap) {
      try {
        await downloadsCap.save({ filename, data: json });
        setBackupMsg('已下載備份檔案');
      } catch (e) {
        if (e && e.code === 'declined') return;
        setBackupMsg('下載失敗，請稍後再試');
      }
      return;
    }

    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setBackupMsg('已下載備份檔案');
  };

  const importBackup = async (file) => {
    if (!file) return;
    if (!window.confirm('還原備份會覆蓋目前所有資產、負債與紀錄，確定要繼續嗎？')) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      const nextAssets = Array.isArray(data.assets) ? data.assets : [];
      const nextLiabilities = Array.isArray(data.liabilities) ? data.liabilities : [];
      const nextHistory = Array.isArray(data.history) ? data.history : [];
      const nextKnownA = Array.isArray(data.knownAssetItems) ? data.knownAssetItems : [];
      const nextKnownL = Array.isArray(data.knownLiabilityItems) ? data.knownLiabilityItems : [];
      setAssets(nextAssets);
      setLiabilities(nextLiabilities);
      setHistory(nextHistory);
      setKnownAssetItems(nextKnownA);
      setKnownLiabilityItems(nextKnownL);
      storageSet('nw-data', { assets: nextAssets, liabilities: nextLiabilities });
      storageSet('nw-history', nextHistory);
      storageSet('nw-known-assets', nextKnownA);
      storageSet('nw-known-liabilities', nextKnownL);
      setBackupMsg('備份還原成功！');
    } catch (e) {
      setBackupMsg('讀取備份檔案失敗，請確認檔案格式是否正確');
    }
  };

  const saveSnapshot = useCallback(() => {
    const now = new Date();
    const weekKey = getWeekKey(latestItemDate);
    const assetsByCategory = computeCategoryBreakdown(assetsTWD, ASSET_CATEGORIES);
    const liabilitiesByCategory = computeCategoryBreakdown(liabilitiesTWD, LIABILITY_CATEGORIES);
    const idx = history.findIndex((h) => (h.weekKey || getWeekKey(h.date)) === weekKey);
    let next;
    if (idx >= 0) {
      next = history.map((h, i) =>
        i === idx
          ? { ...h, date: now.toISOString(), weekKey, totalAssets, totalLiabilities, netWorth, assetsByCategory, liabilitiesByCategory }
          : h
      );
    } else {
      next = [
        ...history,
        { id: uid(), date: now.toISOString(), weekKey, totalAssets, totalLiabilities, netWorth, assetsByCategory, liabilitiesByCategory },
      ];
    }
    setHistory(next);
    storageSet('nw-history', next);
  }, [history, totalAssets, totalLiabilities, netWorth, latestItemDate, assetsTWD, liabilitiesTWD]);

  const deleteHistoryEntry = useCallback(
    (id) => {
      const next = history.filter((h) => h.id !== id);
      setHistory(next);
      storageSet('nw-history', next);
    },
    [history]
  );

  const clearHistory = useCallback(() => {
    if (!window.confirm('確定要清空所有成長紀錄嗎？這個動作無法復原。')) return;
    setHistory([]);
    storageSet('nw-history', []);
  }, []);

  const enrichedHistory = sortedHistoryFilled.map((h, i) => ({
    ...h,
    delta: i === 0 ? 0 : h.netWorth - sortedHistoryFilled[i - 1].netWorth,
  }));
  const chartData = sortedHistoryFilled.map((h) => ({
    label: toLocalDate(h.weekKey || getWeekKey(h.date)).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' }),
    netWorth: h.netWorth,
  }));

  return (
    <div className="nwa-root">
      <header className="nwa-header">
        <p className="eyebrow">個人財富養成計畫</p>
        <h1>資產冒險記</h1>
        <p className="subtitle">記錄資產與負債，看你的角色一路成長（可用不同幣別記帳，自動換算台幣）</p>
      </header>

      <RateBar
        liveRates={liveRates}
        ratesLoading={ratesLoading}
        ratesError={ratesError}
        onRefresh={fetchLiveRates}
      />

      <section className="hero-card">
        <div className="species-picker">
          {SPECIES.map((s) => (
            <button
              key={s.id}
              className={species === s.id ? 'active' : ''}
              onClick={() => setSpecies(s.id)}
              aria-label={s.name}
              title={s.name}
            >
              {s.emoji}
            </button>
          ))}
        </div>
        <div className="char-stage">
          <Character level={level} mood={mood} health={health} species={species} />
        </div>
        <div className="lv-badge">
          <span className="lv-num">Lv.{level.id}</span>
        </div>
        <h2 className="char-title" style={{ color: level.color }}>{level.title}</h2>
        {showPercentile ? (
          <p className="char-percentile">
            {level.percentile}
            <button className="percentile-toggle" onClick={() => setShowPercentile(false)}>隱藏</button>
          </p>
        ) : (
          <button className="percentile-toggle standalone" onClick={() => setShowPercentile(true)}>顯示統計對照</button>
        )}
        <span className={`health-tag tone-${health.tone}`}>
          {health.tone === 'great' && '✨ '}
          {health.label}
        </span>

        <div className="progress-wrap">
          <div className="progress-track">
            <div className="progress-fill" style={{ width: `${progress.percent}%`, background: level.color }} />
          </div>
          <p className="progress-label">{progress.label}</p>
        </div>
      </section>

      <section className="stats-row">
        <div className="stat-card">
          <span className="stat-label">總資產</span>
          <span className="stat-value tone-good">{formatMoney(totalAssets)}</span>
        </div>
        <div className="stat-card">
          <span className="stat-label">總負債</span>
          <span className="stat-value tone-bad">{formatMoney(totalLiabilities)}</span>
        </div>
        <div className="stat-card highlight">
          <span className="stat-label">淨值</span>
          <span className={`stat-value ${netWorth >= 0 ? 'tone-good' : 'tone-bad'}`}>{formatMoney(netWorth)}</span>
        </div>
      </section>

      {lastCompletedEntry && weeklyChange !== null && (
        <p className={`week-delta ${weeklyChange >= 0 ? 'tone-good' : 'tone-bad'}`}>
          {weeklyChange >= 0 ? '▲' : '▼'} 比 {toLocalDate(lastCompletedEntry.weekKey || getWeekKey(lastCompletedEntry.date)).toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' })} 那週{weeklyChange >= 0 ? '增加' : '減少'} {formatMoney(Math.abs(weeklyChange))}
        </p>
      )}

      <nav className="tab-nav">
        <button className={tab === 'assets' ? 'active' : ''} onClick={() => setTab('assets')}>💰 資產</button>
        <button className={tab === 'liabilities' ? 'active' : ''} onClick={() => setTab('liabilities')}>💳 負債</button>
        <button className={tab === 'history' ? 'active' : ''} onClick={() => setTab('history')}>📜 成長紀錄</button>
        <button className={tab === 'charts' ? 'active' : ''} onClick={() => setTab('charts')}>📊 圖表</button>
        <button className={tab === 'insights' ? 'active' : ''} onClick={() => setTab('insights')}>💡 建議</button>
        <button className={tab === 'backup' ? 'active' : ''} onClick={() => setTab('backup')}>💾 備份</button>
      </nav>

      {tab === 'assets' && (
        <>
          <HousePriceQuery onAdd={addHouseAsset} />
          <StockHoldingWidget
            onAdd={addStockHolding}
            onRefreshAll={refreshAllHoldings}
            holdingsCount={assets.filter((a) => a.ticker).length}
          />
          <ItemPanel
            type="asset"
            items={assets}
            categories={ASSET_CATEGORIES}
            form={assetForm}
            setForm={setAssetForm}
            onAdd={() => addItem('asset')}
            onRemove={(id) => removeItem('asset', id)}
            onEdit={(id, updates) => editItem('asset', id, updates)}
            latestItemDate={latestItemDate}
            total={totalAssets}
            getEffectiveRate={getEffectiveRate}
            knownItems={knownAssetItems}
            onImportFile={(file) => handleImportFile(file, 'asset')}
            onCleanup={() => cleanupDuplicates('asset')}
            onRefreshHolding={refreshStockHolding}
          />
        </>
      )}

      {tab === 'liabilities' && (
        <ItemPanel
          type="liability"
          items={liabilities}
          categories={LIABILITY_CATEGORIES}
          form={liabForm}
          setForm={setLiabForm}
          onAdd={() => addItem('liability')}
          onRemove={(id) => removeItem('liability', id)}
          onEdit={(id, updates) => editItem('liability', id, updates)}
          latestItemDate={latestItemDate}
          total={totalLiabilities}
          getEffectiveRate={getEffectiveRate}
          knownItems={knownLiabilityItems}
          onImportFile={(file) => handleImportFile(file, 'liability')}
          onCleanup={() => cleanupDuplicates('liability')}
        />
      )}

      {tab === 'history' && (
        <HistoryPanel
          chartData={chartData}
          enrichedHistory={enrichedHistory}
          onSave={saveSnapshot}
          onDeleteEntry={deleteHistoryEntry}
          onClearAll={clearHistory}
        />
      )}

      {tab === 'charts' && (
        <AllocationPanel
          allocation={currentAssetAllocation}
          totalAssets={totalAssets}
          trendData={categoryTrendData}
          hasCategoryHistory={hasCategoryHistory}
        />
      )}

      {tab === 'insights' && (
        <InsightsPanel
          insights={insights}
          snapshot={{
            levelTitle: level.title,
            netWorth,
            totalAssets,
            totalLiabilities,
            health,
            assets: assetsTWD.map((a) => ({ name: a.name, category: a.category, twd: a.twd })),
            liabilities: liabilitiesTWD.map((l) => ({ name: l.name, category: l.category, twd: l.twd })),
            history: sortedHistory.slice(-8).map((h) => ({ weekKey: h.weekKey || getWeekKey(h.date), netWorth: h.netWorth })),
          }}
        />
      )}

      {tab === 'backup' && (
        <BackupPanel onExport={exportBackup} onImport={importBackup} message={backupMsg} />
      )}
    </div>
  );
}

function InsightsPanel({ insights, snapshot }) {
  const toneIcon = { good: '✅', bad: '⚠️', ok: 'ℹ️' };

  const [apiKey, setApiKey] = useState(() => storageGet('nw-ai-key') || '');
  const [keyDraft, setKeyDraft] = useState('');
  const [aiModel, setAiModel] = useState(() => storageGet('nw-ai-model') || AI_MODELS[0].id);
  const [aiText, setAiText] = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState('');

  useEffect(() => {
    storageSet('nw-ai-model', aiModel);
  }, [aiModel]);

  const saveKey = () => {
    const trimmed = keyDraft.trim();
    if (!trimmed) return;
    setApiKey(trimmed);
    storageSet('nw-ai-key', trimmed);
    setKeyDraft('');
  };

  const clearKey = () => {
    setApiKey('');
    storageSet('nw-ai-key', '');
    setAiText('');
    setAiError('');
  };

  const askAI = async () => {
    if (!apiKey || aiLoading) return;
    setAiLoading(true);
    setAiError('');
    setAiText('');
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
          'content-type': 'application/json',
        },
        body: JSON.stringify({
          model: aiModel,
          max_tokens: 700,
          messages: [{ role: 'user', content: buildAIPrompt(snapshot) }],
        }),
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => null);
        throw new Error((errBody && errBody.error && errBody.error.message) || `API 回應錯誤（狀態碼 ${res.status}）`);
      }
      const data = await res.json();
      const text = (data.content || []).map((block) => block.text || '').join('\n').trim();
      setAiText(text || '（沒有取得回應內容，請再試一次）');
    } catch (e) {
      setAiError(e && e.message === 'Failed to fetch' ? '連線失敗，請確認網路連線或 API Key 是否正確' : (e && e.message) || '發生未知錯誤');
    } finally {
      setAiLoading(false);
    }
  };

  return (
    <section className="panel">
      <div className="panel-head">
        <h3>財務觀察</h3>
      </div>
      <ul className="insight-list">
        {insights.map((tip, i) => (
          <li key={i} className={`insight-item tone-${tip.tone}`}>
            <span className="insight-icon">{toneIcon[tip.tone] || 'ℹ️'}</span>
            <div>
              <p className="insight-title">{tip.title}</p>
              <p className="insight-text">{tip.text}</p>
            </div>
          </li>
        ))}
      </ul>
      <p className="privacy-note">
        以上為根據你輸入的資料自動產生的一般性財務觀察，僅供參考，不構成專業理財或投資建議。實際決策請依個人狀況並諮詢專業理財顧問。
      </p>

      <div className="ai-advice-block">
        <div className="panel-head">
          <h3>AI 深入建議</h3>
        </div>

        {!apiKey ? (
          <>
            <p className="empty-note" style={{ textAlign: 'left', padding: '0 0 10px' }}>
              這個功能會用你自己的 Anthropic API Key，直接從瀏覽器呼叫 Claude，金鑰只存在這台裝置的 localStorage，不會經過任何其他伺服器。還沒有 Key 的話可以到{' '}
              <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer" style={{ color: 'var(--gold)' }}>
                console.anthropic.com
              </a>{' '}申請。
            </p>
            <div className="import-row">
              <input
                type="password"
                placeholder="貼上你的 Anthropic API Key（sk-ant-...）"
                value={keyDraft}
                onChange={(e) => setKeyDraft(e.target.value)}
                style={{
                  flex: 1,
                  minWidth: 0,
                  background: 'var(--bg-deep)',
                  border: '1px solid var(--border)',
                  color: 'var(--text-primary)',
                  borderRadius: 10,
                  padding: '9px 10px',
                  fontSize: 13,
                  fontFamily: 'inherit',
                }}
              />
              <button className="save-btn" onClick={saveKey} disabled={!keyDraft.trim()}>
                💾 儲存
              </button>
            </div>
          </>
        ) : (
          <>
            <div className="import-row">
              <select
                value={aiModel}
                onChange={(e) => setAiModel(e.target.value)}
                style={{
                  flex: 1,
                  minWidth: 0,
                  background: 'var(--bg-deep)',
                  border: '1px solid var(--border)',
                  color: 'var(--text-primary)',
                  borderRadius: 10,
                  padding: '9px 10px',
                  fontSize: 13,
                  fontFamily: 'inherit',
                }}
              >
                {AI_MODELS.map((m) => (
                  <option key={m.id} value={m.id}>{m.label}</option>
                ))}
              </select>
              <button className="ghost-btn small" onClick={askAI} disabled={aiLoading}>
                {aiLoading ? <span className="spin">⏳</span> : '💡'} {aiLoading ? '分析中…' : '詢問 AI'}
              </button>
              <button className="ghost-btn small" onClick={clearKey}>🗑 移除 Key</button>
            </div>

            {aiError && <p className="rate-error">{aiError}</p>}

            {aiText ? (
              <ul className="ai-advice-list">
                <li style={{ whiteSpace: 'pre-wrap' }}>{aiText}</li>
              </ul>
            ) : (
              !aiLoading && !aiError && <p className="empty-note">按「詢問 AI」，讓 Claude 根據你目前的資產狀況給更深入的分析。</p>
            )}
          </>
        )}

        <p className="privacy-note" style={{ marginTop: 12 }}>
          API Key 只存在這台裝置的瀏覽器裡，只會直接送到 Anthropic 的伺服器；你的資產與負債資料會整理成文字一併送出，用來產生這份分析。AI 給的內容僅供參考，不構成專業理財或投資建議。
        </p>
      </div>
    </section>
  );
}

function BackupPanel({ onExport, onImport, message }) {
  const fileInputRef = useRef(null);
  return (
    <section className="panel">
      <div className="panel-head">
        <h3>備份與還原</h3>
      </div>
      <p className="privacy-note">
        建議在清除瀏覽器資料、換裝置或換瀏覽器之前，先下載一份備份檔。備份檔包含資產、負債、成長紀錄與常用項目清單，之後可以用「還原備份」完整復原。
      </p>
      <div className="backup-actions">
        <button className="save-btn full" onClick={onExport}>💾 下載備份檔案（JSON）</button>
        <button className="ghost-btn small" onClick={() => fileInputRef.current.click()}>📤 還原備份</button>
        <input
          ref={fileInputRef}
          type="file"
          accept=".json,application/json"
          style={{ display: 'none' }}
          onChange={(e) => {
            onImport(e.target.files[0]);
            e.target.value = '';
          }}
        />
      </div>
      {message && <p className="import-msg">{message}</p>}
    </section>
  );
}

function StockHoldingWidget({ onAdd, onRefreshAll, holdingsCount }) {
  const [ticker, setTicker] = useState('');
  const [shares, setShares] = useState('');
  const [loading, setLoading] = useState(false);
  const [refreshingAll, setRefreshingAll] = useState(false);
  const [msg, setMsg] = useState('');
  const [error, setError] = useState('');

  const handleAdd = async () => {
    const sharesNum = evaluateExpr(shares);
    if (!ticker.trim() || !sharesNum || sharesNum <= 0) {
      setError('請輸入股票代號與股數');
      return;
    }
    setLoading(true);
    setError('');
    setMsg('');
    try {
      const result = await onAdd(ticker.trim(), sharesNum);
      setMsg(result.updated ? `已更新「${result.name}」的持股與股價` : `已加入「${result.name}」，${sharesNum} 股`);
      setTicker('');
      setShares('');
    } catch (e) {
      setError('查詢股價失敗，請確認是否為上市股票代號（4位數字），或稍後再試');
    }
    setLoading(false);
  };

  const handleRefreshAll = async () => {
    setRefreshingAll(true);
    setError('');
    setMsg('');
    try {
      await onRefreshAll();
      setMsg('已更新所有持股的股價');
    } catch (e) {
      setError('更新失敗，請稍後再試');
    }
    setRefreshingAll(false);
  };

  return (
    <section className="panel">
      <div className="panel-head">
        <h3>📈 持股快速加入</h3>
        {holdingsCount > 0 && (
          <button className="ghost-btn small" onClick={handleRefreshAll} disabled={refreshingAll}>
            <span className={refreshingAll ? 'spin' : ''}>🔄</span> 全部更新股價
          </button>
        )}
      </div>
      <div className="house-query-row">
        <input
          type="text"
          placeholder="股票代號，例如 2330"
          value={ticker}
          onChange={(e) => setTicker(e.target.value)}
        />
        <input
          type="text"
          inputMode="decimal"
          placeholder="股數"
          value={shares}
          onChange={(e) => setShares(e.target.value)}
          className="stock-shares-input"
        />
        <button className="add-btn" onClick={handleAdd} disabled={loading}>
          {loading ? <span className="spin">🔄</span> : '＋'}
        </button>
      </div>
      {msg && <p className="import-msg">{msg}</p>}
      {error && <p className="team-error">{error}</p>}
      <p className="privacy-note">
        輸入台股上市股票代號（4位數字）和股數，會自動抓取最新收盤價換算成金額並加入資產清單（分類為「股票 / 基金」）。資料來源：證交所 OpenAPI，僅支援上市股票，不支援上櫃或美股，請手動輸入。之後可以在清單裡按 🔄 個別更新股價，或用上面的「全部更新股價」一次更新所有持股。
      </p>
    </section>
  );
}

function HousePriceQuery({ onAdd }) {
  const countyNames = Object.keys(TAIWAN_DISTRICTS);
  const [county, setCounty] = useState(countyNames[0]);
  const [district, setDistrict] = useState(TAIWAN_DISTRICTS[countyNames[0]].districts[0]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [result, setResult] = useState(null);
  const [ping, setPing] = useState('');
  const [addMsg, setAddMsg] = useState('');

  const districts = TAIWAN_DISTRICTS[county].districts;

  const handleCountyChange = (next) => {
    setCounty(next);
    setDistrict(TAIWAN_DISTRICTS[next].districts[0]);
    setResult(null);
    setError('');
    setAddMsg('');
  };

  const handleQuery = async () => {
    setLoading(true);
    setError('');
    setResult(null);
    setAddMsg('');
    try {
      const data = await fetchDistrictYearlyPrice(county, district);
      setResult(data);
    } catch (e) {
      setError('查詢失敗，內政部網站可能暫時無法連線，請稍後再試');
    }
    setLoading(false);
  };

  const handleAdd = () => {
    const pingNum = evaluateExpr(ping);
    if (!result || !result.pricePerPing || !pingNum || pingNum <= 0) {
      setAddMsg('請先查詢均價，並輸入坪數');
      return;
    }
    const amount = Math.round(result.pricePerPing * pingNum);
    onAdd(`${county}${district}（約 ${pingNum} 坪，近一年均價估算）`, amount);
    setAddMsg(`已加入「${county}${district}」，估算金額 ${formatMoney(amount)}`);
    setPing('');
  };

  return (
    <section className="panel">
      <div className="panel-head">
        <h3>🏠 房價查詢</h3>
      </div>
      <p className="empty-note" style={{ textAlign: 'left', padding: '0 0 12px' }}>
        用內政部實價登錄公開資料，抓最近可查到的 4 季（約一年）成交紀錄，算出所選行政區的「每坪均價」。只計入房地買賣（不含純土地、純車位交易）。內政部的資料檔案不小，第一次查某個縣市可能要等 30 秒到 1 分鐘，之後同一個縣市（不管換查哪個行政區）就會直接讀取快取，幾乎不用等。
      </p>
      <div className="house-query-row">
        <select value={county} onChange={(e) => handleCountyChange(e.target.value)}>
          {countyNames.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
        <select value={district} onChange={(e) => { setDistrict(e.target.value); setResult(null); setAddMsg(''); }}>
          {districts.map((d) => <option key={d} value={d}>{d}</option>)}
        </select>
      </div>
      <button className="save-btn full" onClick={handleQuery} disabled={loading}>
        {loading ? <><span className="spin">🔄</span> 下載資料中，請稍候（最久約 1 分鐘）…</> : <>🔍 查詢均價</>}
      </button>
      {error && <p className="team-error">{error}</p>}

      {result && (
        <div className="rate-bar" style={{ marginTop: '14px' }}>
          {result.pricePerPing ? (
            <>
              <p style={{ margin: '0 0 4px', fontSize: '13px' }}>
                {county}{district}近一年（{result.seasons.length} 季、共 {result.count} 筆房地成交）平均約
                <strong style={{ color: 'var(--gold)' }}> {formatMoney(Math.round(result.pricePerPing))} / 坪</strong>
              </p>
              {result.count < 5 && (
                <p className="rate-error" style={{ color: 'var(--text-muted)' }}>
                  ⚠️ 這段期間成交筆數偏少，均價僅供參考，實際行情建議多比對幾筆案例。
                </p>
              )}
              <div className="house-query-row" style={{ marginTop: '10px', marginBottom: 0 }}>
                <input
                  type="text"
                  inputMode="decimal"
                  placeholder="坪數"
                  value={ping}
                  onChange={(e) => setPing(e.target.value)}
                  className="stock-shares-input"
                />
                <button className="add-btn" onClick={handleAdd}>＋ 加入資產</button>
              </div>
            </>
          ) : (
            <p style={{ margin: 0, fontSize: '13px', color: 'var(--text-muted)' }}>
              近一年（{result.seasons.length} 季）查無「{county}{district}」的房地成交紀錄，這個區交易量可能很少，建議直接手動輸入或改查鄰近行政區。
            </p>
          )}
        </div>
      )}
      {addMsg && <p className="import-msg">{addMsg}</p>}

      <a
        className="ghost-btn full"
        href="https://lvr.land.moi.gov.tw/"
        target="_blank"
        rel="noopener noreferrer"
        style={{ textDecoration: 'none' }}
      >
        🔗 想查特定門牌或社區，前往內政部實價登錄查詢
      </a>
    </section>
  );
}

function RateBar({ liveRates, ratesLoading, ratesError, onRefresh }) {
  return (
    <div className="rate-bar">
      <div className="rate-bar-top">
        <button className="ghost-btn small" onClick={onRefresh} disabled={ratesLoading}>
          <span className={ratesLoading ? 'spin' : ''}>🔄</span>
          {ratesLoading ? '更新中…' : '更新即時匯率'}
        </button>
        <span className="rate-updated">
          {liveRates && liveRates.updatedAt
            ? `最後更新：${new Date(liveRates.updatedAt).toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}`
            : '目前使用預設參考匯率'}
        </span>
      </div>
      <div className="rate-list">
        {CURRENCIES.filter((c) => c.code !== 'TWD').map((c) => {
          const r = liveRates && typeof liveRates[c.code] === 'number' ? liveRates[c.code] : c.rate;
