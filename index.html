<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a56db">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="市場早報">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>市場早報</title>
<style>
:root{
  --bg:#f0f4f8;--card:#fff;--bdr:#e2e8f0;
  --tx:#1a202c;--mu:#718096;--hi:#a0aec0;
  --G:#276749;--Gbg:#f0fff4;--Gm:#38a169;
  --R:#9b2335;--Rbg:#fff5f5;--Rm:#e53e3e;
  --B:#1a56db;--Bbg:#ebf8ff;--Bm:#3182ce;
  --r:16px;--rs:10px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
.topbar{background:var(--B);color:#fff;padding:calc(env(safe-area-inset-top,0px)+14px) 16px 14px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(26,86,219,.3)}
.topbar-left h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
.topbar-left p{font-size:11px;opacity:.75;margin-top:2px}
.upd-btn{font-size:12px;padding:7px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer;font-family:inherit;font-weight:500}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(env(safe-area-inset-bottom,0px)+20px)}
.signal{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.signal.up{background:var(--Gbg);border:1.5px solid #9ae6b4}
.signal.dn{background:var(--Rbg);border:1.5px solid #feb2b2}
.signal.fl{background:var(--card);border:1px solid var(--bdr)}
.sig-ic{font-size:28px;flex-shrink:0}
.sig-bd{flex:1;min-width:0}
.sig-t{font-size:13px;font-weight:700}
.sig-t.up{color:var(--G)}.sig-t.dn{color:var(--R)}.sig-t.fl{color:var(--tx)}
.sig-d{font-size:12px;margin-top:3px;line-height:1.45}
.sig-d.up{color:#2f855a}.sig-d.dn{color:#c53030}.sig-d.fl{color:var(--mu)}
.sig-a{font-size:10px;color:var(--hi);margin-top:4px}
.sig-v{flex-shrink:0;text-align:right}
.sig-v .big{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sig-v .big.up{color:var(--G)}.sig-v .big.dn{color:var(--R)}.sig-v .big.fl{color:var(--tx)}
.sig-v .sm{font-size:10px;color:var(--hi);margin-top:3px}
.ig-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ig-label{font-size:12px;color:var(--mu);font-weight:500}
.ig-hint{font-size:10px;color:var(--hi)}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ic{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);cursor:grab;transition:transform .15s,box-shadow .15s;user-select:none}
.ic:active{cursor:grabbing}
.ic.dragging{opacity:.5;transform:scale(.97)}
.ic.drag-over{box-shadow:0 0 0 2px var(--B),var(--shadow)}
.ic.hl{border:2px solid var(--Gm);background:linear-gradient(135deg,#f0fff4 0%,#fff 100%)}
.ic-l{font-size:11px;color:var(--mu);margin-bottom:3px;display:flex;align-items:center;gap:5px;font-weight:500}
.lead-tag{font-size:9px;background:var(--Gm);color:#fff;padding:1px 6px;border-radius:4px;font-weight:700}
.ic-v{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--tx)}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:3px 9px;border-radius:6px;margin-top:6px;font-weight:700}
.badge.up{background:#c6f6d5;color:var(--G)}
.badge.dn{background:#fed7d7;color:var(--R)}
.badge.fl{background:#edf2f7;color:var(--mu)}
.ic-p{font-size:10px;color:var(--hi);margin-top:4px}
.drag-hint{font-size:10px;color:var(--hi);text-align:center;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.c-title{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:2px}
.c-sub{font-size:11px;color:var(--mu);margin-bottom:12px}
.mkt-seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--B);border-radius:10px;overflow:hidden;margin-bottom:12px}
.mkt-btn{font-size:13px;padding:10px 4px;text-align:center;background:transparent;border:none;color:var(--B);cursor:pointer;font-family:inherit;font-weight:600}
.mkt-btn.a{background:var(--B);color:#fff}
.seg{display:flex;border:1px solid var(--bdr);border-radius:10px;overflow:hidden;margin-bottom:12px;flex-wrap:wrap}
.sb{flex:1;min-width:58px;font-size:11px;padding:9px 4px;text-align:center;background:transparent;border:none;color:var(--mu);cursor:pointer;font-family:inherit;font-weight:500;border-right:1px solid var(--bdr)}
.sb:last-child{border-right:none}
.sb.a{background:var(--Bbg);color:var(--B);font-weight:700}
.trend-card{background:#f7fafc;border-radius:10px;padding:10px 12px;margin-bottom:10px;border:1px solid var(--bdr)}
.trend-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.trend-name{font-size:12px;font-weight:600;color:var(--tx)}
.trend-pct{font-size:12px;font-weight:700}
.trend-pct.up{color:var(--Gm)}.trend-pct.dn{color:var(--Rm)}.trend-pct.fl{color:var(--mu)}
.trend-sub{font-size:10px;color:var(--hi)}
.hc-wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.hcell{border-radius:6px;padding:7px 3px;text-align:center;font-size:9px;font-weight:700;line-height:1.35;cursor:default}
.hcell:active{opacity:.8}
.status{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--Gm);flex-shrink:0}
.dot.busy{background:#dd6b20}.dot.err{background:var(--Rm)}
.stxt{font-size:11px;color:var(--hi);flex:1}
.lupd{font-size:10px;color:var(--hi);text-align:center;padding-bottom:4px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <h1>市場早報</h1>
    <p id="topSub">每日 08:00 自動更新</p>
  </div>
  <button class="upd-btn" onclick="loadData()">↻ 更新</button>
</div>
<div class="scroll">
  <div class="status">
    <span class="dot" id="dot"></span>
    <span class="stxt" id="stxt">載入中...</span>
  </div>
  <div id="banner"></div>
  <div class="ig-header">
    <span class="ig-label">指數總覽</span>
    <span class="ig-hint">☰ 長按卡片可拖拉排序</span>
  </div>
  <div class="ig" id="idxGrid"></div>
  <div class="card">
    <div class="c-title">板塊熱力圖</div>
    <div class="c-sub" id="heatSub">深綠強漲 · 深紅重跌</div>
    <div class="mkt-seg">
      <button class="mkt-btn a" id="mkt0" onclick="setMkt(0)">🇹🇼 台股</button>
      <button class="mkt-btn"   id="mkt1" onclick="setMkt(1)">🇺🇸 SOX 費半</button>
    </div>
    <div class="seg" id="seg"></div>
    <div class="trend-card">
      <div class="trend-top">
        <span class="trend-name" id="trendName">板塊走勢</span>
        <span class="trend-pct" id="trendPct"></span>
      </div>
      <div class="trend-sub" id="trendSub">近1個月綜合走勢</div>
      <div style="position:relative;height:80px;margin-top:8px">
        <canvas id="trendChart" role="img" aria-label="板塊近1個月走勢圖"></canvas>
      </div>
    </div>
    <div class="hc-wrap" id="hg"></div>
  </div>
  <div class="lupd" id="lupd"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const DATA_URL = './data.json';
let data = null, mkt = 0, subTab = 0, trendChart = null;

const DEFAULT_ORDER = ['TSM_ADR','TWII','SOX','N225'];
let idxOrder = (() => {
  try { return JSON.parse(localStorage.getItem('idxOrder')) || DEFAULT_ORDER; }
  catch { return DEFAULT_ORDER; }
})();

const IDX_META = {
  TSM_ADR: {label:'TSM ADR',   lead:true,  dollar:true},
  TWII:    {label:'台股 TAIEX',lead:false, dollar:false},
  SOX:     {label:'費半 SOX',  lead:false, dollar:false},
  N225:    {label:'日經 225',  lead:false, dollar:false},
};

const sg = v => v >= 0 ? '+' : '';
const fm = (v, d=2) => (+v||0).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
function hc(v){
  if(v>2)    return{bg:'#276749',fg:'#c6f6d5'};
  if(v>0.8)  return{bg:'#38a169',fg:'#f0fff4'};
  if(v>0.2)  return{bg:'#68d391',fg:'#1c4532'};
  if(v>-0.2) return{bg:'#e2e8f0',fg:'#4a5568'};
  if(v>-0.8) return{bg:'#fc8181',fg:'#742a2a'};
  if(v>-2)   return{bg:'#e53e3e',fg:'#fff5f5'};
  return      {bg:'#9b2335',fg:'#fed7d7'};
}

function currentSectors(){
  if(!data) return [];
  return mkt===0 ? (data.tw_sectors||[]) : (data.sox_sectors||[]);
}

function renderBanner(){
  const tsm = data.indices.TSM_ADR || data.indices.TSM;
  if(!tsm||!tsm.price) return;
  const c = tsm.changePercent;
  const dir = c>0.3?'up':c<-0.3?'dn':'fl';
  const strength = Math.abs(c)>2?'強烈':Math.abs(c)>1?'明顯':'溫和';
  const ico = dir==='up'?'📈':dir==='dn'?'📉':'📊';
  const sig = dir==='up'?`${strength}看多訊號 — 台股半導體預期開高`
            : dir==='dn'?`${strength}看空訊號 — 台股半導體預期開低`
            : '訊號偏中性 — 方向待觀察';
  document.getElementById('banner').innerHTML=`
    <div class="signal ${dir}">
      <div class="sig-ic">${ico}</div>
      <div class="sig-bd">
        <div class="sig-t ${dir}">TSM ADR 領先訊號</div>
        <div class="sig-d ${dir}">${sig}</div>
        <div class="sig-a">美東昨收 $${fm(tsm.price)} · Yahoo Finance</div>
      </div>
      <div class="sig-v">
        <div class="big ${dir}">${sg(c)}${c.toFixed(2)}%</div>
        <div class="sm">前 $${fm(tsm.prev)}</div>
      </div>
    </div>`;
}

function renderIdx(){
  const grid = document.getElementById('idxGrid');
  grid.innerHTML = idxOrder.map(key => {
    const d = data.indices[key];
    const m = IDX_META[key];
    if(!d||!d.price||!m) return '';
    const c = d.changePercent, dir = c>0?'up':c<0?'dn':'fl';
    return`<div class="ic${m.lead?' hl':''}" draggable="true" data-key="${key}"
        ondragstart="onDragStart(event)" ondragover="onDragOver(event)"
        ondrop="onDrop(event)" ondragend="onDragEnd(event)"
        ontouchstart="onTouchStart(event)" ontouchmove="onTouchMove(event)" ontouchend="onTouchEnd(event)">
      <div class="ic-l">${m.label}${m.lead?'<span class="lead-tag">領先</span>':''}</div>
      <div class="ic-v">${m.dollar?'$':''}${fm(d.price,m.dollar?2:0)}</div>
      <div class="badge ${dir}">${c>=0?'▲':'▼'} ${Math.abs(c).toFixed(2)}%</div>
      <div class="ic-p">前 ${m.dollar?'$':''}${fm(d.prev,m.dollar?2:0)}</div>
    </div>`;
  }).join('');
}

let dragKey = null;
function onDragStart(e){
  dragKey = e.currentTarget.dataset.key;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}
function onDragOver(e){
  e.preventDefault();
  document.querySelectorAll('.ic').forEach(el=>el.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function onDrop(e){
  e.preventDefault();
  const targetKey = e.currentTarget.dataset.key;
  if(dragKey && dragKey !== targetKey){
    const fi = idxOrder.indexOf(dragKey), ti = idxOrder.indexOf(targetKey);
    if(fi>-1&&ti>-1){ idxOrder.splice(fi,1); idxOrder.splice(ti,0,dragKey); }
    localStorage.setItem('idxOrder', JSON.stringify(idxOrder));
    renderIdx();
  }
}
function onDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.ic').forEach(el=>el.classList.remove('drag-over'));
  dragKey = null;
}

let touchKey=null, touchStartX=0, touchStartY=0, touchClone=null;
function onTouchStart(e){
  const el=e.currentTarget;
  touchKey=el.dataset.key;
  const t=e.touches[0];
  touchStartX=t.clientX; touchStartY=t.clientY;
  touchClone=el.cloneNode(true);
  touchClone.style.cssText=`position:fixed;opacity:.8;pointer-events:none;z-index:999;width:${el.offsetWidth}px;left:${el.getBoundingClientRect().left}px;top:${el.getBoundingClientRect().top}px;`;
  document.body.appendChild(touchClone);
  el.classList.add('dragging');
}
function onTouchMove(e){
  if(!touchClone) return;
  e.preventDefault();
  const t=e.touches[0];
  touchClone.style.left=(t.clientX-touchStartX+parseFloat(touchClone.style.left))+'px';
  touchClone.style.top=(t.clientY-touchStartY+parseFloat(touchClone.style.top))+'px';
  touchStartX=t.clientX; touchStartY=t.clientY;
  const els=document.elementsFromPoint(t.clientX,t.clientY);
  document.querySelectorAll('.ic').forEach(el=>el.classList.remove('drag-over'));
  const target=els.find(el=>el.classList.contains('ic')&&el.dataset.key!==touchKey);
  if(target) target.classList.add('drag-over');
}
function onTouchEnd(e){
  if(touchClone){ document.body.removeChild(touchClone); touchClone=null; }
  document.querySelectorAll('.ic').forEach(el=>{
    el.classList.remove('dragging','drag-over');
  });
  const t=e.changedTouches[0];
  const els=document.elementsFromPoint(t.clientX,t.clientY);
  const target=els.find(el=>el.classList&&el.classList.contains('ic')&&el.dataset&&el.dataset.key!==touchKey);
  if(target&&touchKey){
    const fi=idxOrder.indexOf(touchKey), ti=idxOrder.indexOf(target.dataset.key);
    if(fi>-1&&ti>-1){ idxOrder.splice(fi,1); idxOrder.splice(ti,0,touchKey); }
    localStorage.setItem('idxOrder', JSON.stringify(idxOrder));
    renderIdx();
  }
  touchKey=null;
}

function renderTrend(sec){
  const trend = sec.trend||[];
  if(trendChart){ trendChart.destroy(); trendChart=null; }
  const last = trend.length ? trend[trend.length-1] : 0;
  const dir = last>0?'up':last<0?'dn':'fl';
  document.getElementById('trendName').textContent = `${sec.name} 板塊`;
  document.getElementById('trendPct').textContent = trend.length ? `${sg(last)}${last.toFixed(2)}%` : '—';
  document.getElementById('trendPct').className = `trend-pct ${dir}`;
  document.getElementById('trendSub').textContent = `近1個月綜合走勢（${trend.length}個交易日）`;
  if(!trend.length) return;
  const color = last>=0?'#38a169':'#e53e3e';
  const bgColor = last>=0?'rgba(56,161,105,.12)':'rgba(229,62,62,.12)';
  const ctx = document.getElementById('trendChart');
  trendChart = new Chart(ctx,{
    type:'line',
    data:{
      labels: trend.map((_,i)=>i),
      datasets:[{
        data:trend, borderColor:color, borderWidth:2,
        pointRadius:0, tension:.35, fill:true, backgroundColor:bgColor
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{
        callbacks:{label:c=>`${sg(c.parsed.y)}${c.parsed.y.toFixed(2)}%`}
      }},
      scales:{
        x:{display:false},
        y:{display:true,position:'right',
           ticks:{font:{size:9},callback:v=>v.toFixed(1)+'%',maxTicksLimit:4},
           grid:{color:'rgba(0,0,0,.04)'},border:{display:false}}
      }
    }
  });
}

function renderHeat(){
  const sectors = currentSectors();
  if(!sectors.length){ document.getElementById('hg').innerHTML=''; return; }
  document.getElementById('mkt0').className='mkt-btn'+(mkt===0?' a':'');
  document.getElementById('mkt1').className='mkt-btn'+(mkt===1?' a':'');
  document.getElementById('heatSub').textContent =
    mkt===0?'台股板塊 — 富邦即時':'SOX 費半 — Yahoo Finance';
  document.getElementById('seg').innerHTML = sectors.map((sec,i)=>
    `<button class="sb${subTab===i?' a':''}" onclick="setSubTab(${i})">${sec.name}</button>`
  ).join('');
  const sec = sectors[subTab]||sectors[0];
  renderTrend(sec);
  document.getElementById('hg').innerHTML = sec.stocks.map(st=>{
    const col=hc(st.changePercent);
    return`<div class="hcell" style="background:${col.bg};color:${col.fg}"
      title="${st.name} ${sg(st.changePercent)}${st.changePercent.toFixed(2)}%">
      ${st.name.substring(0,4)}<br>${sg(st.changePercent)}${st.changePercent.toFixed(1)}%
    </div>`;
  }).join('');
}

function setMkt(m){ mkt=m; subTab=0; renderHeat(); }
function setSubTab(i){ subTab=i; renderHeat(); }

function renderAll(){
  renderBanner();
  renderIdx();
  renderHeat();
  const upd=new Date(data.updated);
  document.getElementById('lupd').textContent=`資料時間：${upd.toLocaleString('zh-TW')}`;
  document.getElementById('topSub').textContent=`${data.date} 更新`;
}

async function loadData(){
  const dot=document.getElementById('dot');
  const stxt=document.getElementById('stxt');
  dot.className='dot busy'; stxt.textContent='抓取資料中...';
  try{
    const res=await fetch(`${DATA_URL}?t=${Date.now()}`);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    data=await res.json();
    const allKeys=Object.keys(IDX_META);
    allKeys.forEach(k=>{ if(!idxOrder.includes(k)) idxOrder.push(k); });
    dot.className='dot';
    stxt.textContent=data.source==='fubon_neo'?'富邦即時 + Yahoo Finance':'資料載入完成';
    renderAll();
  }catch(e){
    dot.className='dot err';
    stxt.textContent=`載入失敗：${e.message}`;
  }
}

loadData();
</script>
</body>
</html>
