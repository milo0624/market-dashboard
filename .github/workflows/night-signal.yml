name: 今晚夜盤判斷
on:
  schedule:
    - cron: '5 6 * * 1-5'     # 台灣時間 14:05（日盤 13:45 收盤後、夜盤 15:00 開盤前）
  workflow_dispatch:
concurrency:
  group: market-update       # 與每日早報共用，避免兩個流程同時推送
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install-sdk
        run: |
          wget -q "https://www.fbs.com.tw/TradeAPI_SDK/fubon_binary/fubon_neo-2.2.8-cp37-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.zip" -O sdk.zip
          unzip -q sdk.zip
          pip install fubon_neo-2.2.8-cp37-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
      - name: judge
        env:
          FUBON_ID: ${{ secrets.FUBON_ID }}
          FUBON_API_KEY: ${{ secrets.FUBON_API_KEY }}
          FUBON_CERT_B64: ${{ secrets.FUBON_CERT_B64 }}
          FUBON_CERT_PW: ${{ secrets.FUBON_CERT_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python night_signal.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/night_signal.json public/night_history.json
          git diff --staged --quiet || git commit -m "night signal $(date +'%Y-%m-%d')"
          git pull --rebase
          git push
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
