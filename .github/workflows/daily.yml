name: market-update
on:
  schedule:
    - cron: '30 22 * * 0-4'   # 台灣時間 06:30（UTC 22:30 前一天）
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install-sdk
        run: |
          wget -q "https://www.fbs.com.tw/TradeAPI_SDK/fubon_binary/fubon_neo-2.2.8-cp37-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.zip" -O sdk.zip
          unzip -q sdk.zip
          pip install fubon_neo-2.2.8-cp37-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl requests
      - name: fetch
        env:
          FUBON_ID: ${{ secrets.FUBON_ID }}
          FUBON_API_KEY: ${{ secrets.FUBON_API_KEY }}
          FUBON_SECRET_KEY: ${{ secrets.FUBON_SECRET_KEY }}
          FUBON_CERT_B64: ${{ secrets.FUBON_CERT_B64 }}
          FUBON_CERT_PW: ${{ secrets.FUBON_CERT_PW }}
        run: python fetch_market.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/signal_history.json
          git diff --staged --quiet || git commit -m "data update $(date +'%Y-%m-%d')"
          git push
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
      - name: notify-on-failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ 市場早報資料更新失敗"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "再次失敗，請查看 log：$RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" \
              --body "自動更新流程（$(date +'%Y-%m-%d')）執行失敗，請查看 log：$RUN_URL"
          fi
