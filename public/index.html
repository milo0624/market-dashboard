<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a56db">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="市場早報">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>市場早報</title>
<style>
:root{
  --bg:#f0f4f8;--card:#fff;--bdr:#e2e8f0;
  --tx:#1a202c;--mu:#718096;--hi:#a0aec0;
  --G:#276749;--Gbg:#f0fff4;--Gm:#38a169;
  --R:#9b2335;--Rbg:#fff5f5;--Rm:#e53e3e;
  --B:#1a56db;--Bbg:#ebf8ff;--Bm:#3182ce;
  --r:16px;--rs:10px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}

.topbar{background:var(--B);color:#fff;padding:calc(env(safe-area-inset-top,0px)+14px) 16px 14px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(26,86,219,.3)}
.topbar-left h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
.topbar-left p{font-size:11px;opacity:.75;margin-top:2px}
.upd-btn{font-size:12px;padding:7px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer;font-family:inherit;font-weight:500}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(env(safe-area-inset-bottom,0px)+20px)}

/* 領先訊號 */
.signal{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.signal.up{background:var(--Gbg);border:1.5px solid #9ae6b4}
.signal.dn{background:var(--Rbg);border:1.5px solid #feb2b2}
.signal.fl{background:var(--card);border:1px solid var(--bdr)}
.sig-ic{font-size:28px;flex-shrink:0}
.sig-bd{flex:1;min-width:0}
.sig-t{font-size:13px;font-weight:700}
.sig-t.up{color:var(--G)}.sig-t.dn{color:var(--R)}.sig-t.fl{color:var(--tx)}
.sig-d{font-size:12px;margin-top:3px;line-height:1.45}
.sig-d.up{color:#2f855a}.sig-d.dn{color:#c53030}.sig-d.fl{color:var(--mu)}
.sig-a{font-size:10px;color:var(--hi);margin-top:4px}
.sig-v{flex-shrink:0;text-align:right}
.sig-v .big{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sig-v .big.up{color:var(--G)}.sig-v .big.dn{color:var(--R)}.sig-v .big.fl{color:var(--tx)}
.sig-v .sm{font-size:10px;color:var(--hi);margin-top:3px}

/* 指數卡片區 */
.ig-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ig-label{font-size:12px;color:var(--mu);font-weight:500}
.ig-hint{font-size:10px;color:var(--hi)}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ic{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);cursor:grab;transition:transform .15s,box-shadow .15s;user-select:none}
.ic:active{cursor:grabbing}
.ic.dragging{opacity:.5;transform:scale(.97)}
.ic.drag-over{box-shadow:0 0 0 2px var(--B),var(--shadow)}
.ic.hl{border:2px solid var(--Gm);background:linear-gradient(135deg,#f0fff4 0%,#fff 100%)}
.ic-l{font-size:11px;color:var(--mu);margin-bottom:3px;display:flex;align-items:center;gap:5px;font-weight:500}
.lead-tag{font-size:9px;background:var(--Gm);color:#fff;padding:1px 6px;border-radius:4px;font-weight:700}
.ic-v{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--tx)}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:3px 9px;border-radius:6px;margin-top:6px;font-weight:700}
.badge.up{background:#c6f6d5;color:var(--G)}
.badge.dn{background:#fed7d7;color:var(--R)}
.badge.fl{background:#edf2f7;color:var(--mu)}
.ic-p{font-size:10px;color:var(--hi);margin-top:4px}
.drag-hint{font-size:10px;color:var(--hi);text-align:center;margin-bottom:10px}

/* 熱力圖卡片 */
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.c-title{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:2px}
.c-sub{font-size:11px;color:var(--mu);margin-bottom:12px}

.mkt-seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--B);border-radius:10px;overflow:hidden;margin-bottom:12px}
.mkt-btn{font-size:13px;padding:10px 4px;text-align:center;background:transparent;border:none;color:var(--B);cursor:pointer;font-family:inherit;font-weight:600}
.mkt-btn.a{background:var(--B);color:#fff}

.seg{display:flex;border:1px solid var(--bdr);border-radius:10px;overflow:hidden;margin-bottom:12px;flex-wrap:wrap}
.sb{flex:1;min-width:58px;font-size:11px;padding:9px 4px;text-align:center;background:transparent;border:none;color:var(--mu);cursor:pointer;font-family:inherit;font-weight:500;border-right:1px solid var(--bdr)}
.sb:last-child{border-right:none}
.sb.a{background:var(--Bbg);color:var(--B);font-weight:700}

/* 走勢圖 */
.trend-card{background:#f7fafc;border-radius:10px;padding:10px 12px;margin-bottom:10px;border:1px solid var(--bdr)}
.trend-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.trend-name{font-size:12px;font-weight:600;color:var(--tx)}
.trend-pct{font-size:12px;font-weight:700}
.trend-pct.up{color:var(--Gm)}.trend-pct.dn{color:var(--Rm)}.trend-pct.fl{color:var(--mu)}
.trend-sub{font-size:10px;color:var(--hi)}

/* 熱力格 */
.hc-wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.hcell{border-radius:6px;padding:7px 3px;text-align:center;font-size:9px;font-weight:700;line-height:1.35;cursor:default}
.hcell:active{opacity:.8}

.status{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--Gm);flex-shrink:0}
.dot.busy{background:#dd6b20}.dot.err{background:var(--Rm)}
.stxt{font-size:11px;color:var(--hi);flex:1}
.lupd{font-size:10px;color:var(--hi);text-align:center;padding-bottom:4px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <h1>市場早報</h1>
    <p id="topSub">每日 08:00 自動更新</p>
  </div>
  <button class="upd-btn" onclick="loadData()">↻ 更新</button>
</div>

<div class="scroll">
  <div class="status">
    <span class="dot" id="dot"></span>
    <span class="stxt" id="stxt">載入中...</span>
  </div>
  <div id="banner"></div>

  <div class="ig-header">
    <span class="ig-label">指數總覽</span>
    <span class="ig-hint">☰ 長按卡片可拖拉排序</span>
  </div>
  <div class="ig" id="idxGrid"></div>

  <div class="card">
    <div class="c-title">板塊熱力圖</div>
    <div class="c-sub" id="heatSub">深綠強漲 · 深紅重跌</div>
    <div class="mkt-seg">
      <button class="mkt-btn a" id="mkt0" onclick="setMkt(0)">🇹🇼 台股</button>
      <button class="mkt-btn"   id="mkt1" onclick="setMkt(1)">🇺🇸 SOX 費半</button>
    </div>
    <div class="seg" id="seg"></div>
    <div class="trend-card">
      <div class="trend-top">
        <span class="trend-name" id="trendName">板塊走勢</span>
        <span class="trend-pct" id="trendPct"></span>
